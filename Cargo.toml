[workspace]
resolver = "3"
members = ["crates/*", "crates/larmorx-afni-replica/tools/csfft-verify"]
# The GPL and FSL replica workspaces are their own (docs/licensing.md); this one never builds them.
# The AFNI replicas are in this one since 2026-10-29 (crates/larmorx-afni-replica, CC BY 4.0's
# attribution in NOTICE); crates-gpl holds only verification tools that keep glibc's LGPL code.
exclude = ["crates-gpl", "crates-nc"]

[workspace.package]
# One version for larmorx, larmorx-gpl and larmorx-nc: scripts/release/set_version.py sets it.
version = "0.1.0-rc.1"
edition = "2024"
# The compiler a build from source needs at least: the one rust-toolchain.toml pins.
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/karellopez/larmorx"

# Pure-Rust dependencies only (CLAUDE.md rule 5): no C, C++, Fortran or HDF5 libraries.
[workspace.dependencies]
larmorx-core = { path = "crates/larmorx-core", version = "0.1.0-rc.1" }
larmorx-io = { path = "crates/larmorx-io", version = "0.1.0-rc.1" }
larmorx-hdf5 = { path = "crates/larmorx-hdf5", version = "0.1.0-rc.1" }
larmorx-cli = { path = "crates/larmorx-cli", version = "0.1.0-rc.1" }
larmorx-transform = { path = "crates/larmorx-transform", version = "0.1.0-rc.1" }
larmorx-interp = { path = "crates/larmorx-interp", version = "0.1.0-rc.1" }
larmorx-image = { path = "crates/larmorx-image", version = "0.1.0-rc.1" }
larmorx-ants = { path = "crates/larmorx-ants", version = "0.1.0-rc.1" }
larmorx-afni = { path = "crates/larmorx-afni", version = "0.1.0-rc.1" }
larmorx-afni-replica = { path = "crates/larmorx-afni-replica", version = "0.1.0-rc.1" }
larmorx-mri = { path = "crates/larmorx-mri", version = "0.1.0-rc.1" }
larmorx-fsl = { path = "crates/larmorx-fsl", version = "0.1.0-rc.1" }
larmorx-registration = { path = "crates/larmorx-registration", version = "0.1.0-rc.1" }
larmorx-sdcflows = { path = "crates/larmorx-sdcflows", version = "0.1.0-rc.1" }
larmorx-optim = { path = "crates/larmorx-optim", version = "0.1.0-rc.1" }
larmorx-ndimage = { path = "crates/larmorx-ndimage", version = "0.1.0-rc.1" }
pyo3 = { version = "0.29.3", features = ["abi3-py312"] }
numpy = "0.29.0"
ndarray = "0.17.2"
num-complex = { version = "0.4.6", features = ["bytemuck"] }
bytemuck = "1.25.2"
rayon = "1.12.0"
thiserror = "2.0.21"
libm = "0.2.16"
# zlib-rs: the pure-Rust zlib implementation (no C zlib).
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
crc32fast = "1.5.2"
# Pure-Rust zstd and bzip2 (libbz2-rs-sys, bzip2's default backend): FSL 6.0.7.23's output types.
ruzstd = "0.9.1"
bzip2 = "0.6.1"
proptest = "1.11.0"
tempfile = "3.27.0"
# Test-only: SHA-256 for the AFNI replicas' golden tests (larmorx-cli/tests/afni_replica_golden.rs).
sha2 = { version = "0.11.0", default-features = false }

# The released files' profile (`maturin build --profile dist`, `cargo build --profile dist`): the
# release profile with the whole program optimised as one unit (fat LTO, one codegen unit) and the
# symbols stripped, for smaller files (docs/next-steps.md, "Releases on PyPI": "Size"). The same
# bits as `release` (no fast-math, the same opt-level; the golden tests and the parity smoke tier
# pass on it, validation/investigations/release-0.1/README.md). Everyday builds, CI, verify-merge
# and the agents keep `release`: fat LTO adds minutes of single-threaded linking.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
