[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/karellopez/larmorx"

# Pure-Rust dependencies only (CLAUDE.md rule 5): no C, C++, Fortran or HDF5 libraries.
[workspace.dependencies]
larmorx-core = { path = "crates/larmorx-core", version = "0.0.1" }
larmorx-io = { path = "crates/larmorx-io", version = "0.0.1" }
larmorx-cli = { path = "crates/larmorx-cli", version = "0.0.1" }
larmorx-transform = { path = "crates/larmorx-transform", version = "0.0.1" }
larmorx-interp = { path = "crates/larmorx-interp", version = "0.0.1" }
larmorx-image = { path = "crates/larmorx-image", version = "0.0.1" }
larmorx-ants = { path = "crates/larmorx-ants", version = "0.0.1" }
pyo3 = { version = "0.29.3", features = ["abi3-py312"] }
numpy = "0.29.0"
ndarray = "0.17.2"
num-complex = { version = "0.4.6", features = ["bytemuck"] }
bytemuck = "1.25.2"
rayon = "1.12.0"
thiserror = "2.0.21"
libm = "0.2.16"
# zlib-rs: the pure-Rust zlib implementation (no C zlib).
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
crc32fast = "1.5.2"
proptest = "1.11.0"
tempfile = "3.27.0"
