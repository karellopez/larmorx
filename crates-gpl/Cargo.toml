# The GPL-3.0-or-later workspace (docs/licensing.md). It is a separate Cargo workspace, so the
# Apache-2.0 workspace at the repository root never builds it, and no Apache crate can depend
# on it. Its crates may depend on the Apache crates (Apache-2.0 code may be included in a GPL-3
# work); the reverse is forbidden.
#
# The `larmorx-gpl` package (a program, as `larmorx-nc` is: docs/licensing.md): tedana's t2smap
# replica (larmorx-gpl-tedana, GPL-3.0-only: tedana is LGPL-2.1-only, converted to the GPL under
# its section 3) and the `larmorx-gpl` command line (larmorx-gpl-cli); later Connectome
# Workbench's replicas (GPL-2.0-or-later). Since 2026-10-29 the AFNI replicas live in the main
# package (crates/larmorx-afni-replica); the verification tools that need their earlier
# translations of glibc's LGPL code stay here (tools/glibc-reference) and are not packaged.
[workspace]
resolver = "3"
members = [
    "larmorx-gpl-tedana",
    "larmorx-gpl-cli",
    "larmorx-gpl-gsl",
    "tools/cbrtf-measure",
    "tools/floatmath-verify",
    "tools/glibc-dbl-model",
    "tools/glibc-reference",
    "tools/sincosf-verify",
]

[workspace.package]
# One version for larmorx, larmorx-gpl and larmorx-nc: scripts/release/set_version.py sets it.
version = "0.1.0-rc.1"
edition = "2024"
# The compiler a build from source needs at least: the one rust-toolchain.toml pins.
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/karellopez/larmorx"

# Pure-Rust dependencies only (CLAUDE.md rule 5): no C, C++, Fortran or HDF5 libraries.
[workspace.dependencies]
larmorx-core = { path = "../crates/larmorx-core", version = "0.1.0-rc.1" }
larmorx-io = { path = "../crates/larmorx-io", version = "0.1.0-rc.1" }
larmorx-interp = { path = "../crates/larmorx-interp", version = "0.1.0-rc.1" }
larmorx-transform = { path = "../crates/larmorx-transform", version = "0.1.0-rc.1" }
larmorx-optim = { path = "../crates/larmorx-optim", version = "0.1.0-rc.1" }
# ANALYZE 7.5 and MGH/MGZ as nibabel loads them (larmorx_tedana::formats), for the t2smap replica
larmorx-tedana = { path = "../crates/larmorx-tedana", version = "0.1.0-rc.1" }
larmorx-gpl-tedana = { path = "larmorx-gpl-tedana", version = "0.1.0-rc.1" }
larmorx-afni-replica = { path = "../crates/larmorx-afni-replica", version = "0.1.0-rc.1" }
glibc-reference = { path = "tools/glibc-reference" }
rayon = "1.12.0"
thiserror = "2.0.21"
tempfile = "3.27.0"
# dev-dependencies of the golden tests (as the root workspace's)
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
sha2 = { version = "0.11.0", default-features = false }

# The released files' profile (`maturin build --profile dist`, `cargo build --profile dist`): the
# release profile with the whole program optimised as one unit (fat LTO, one codegen unit) and the
# symbols stripped, for smaller files (docs/next-steps.md, "Releases on PyPI": "Size"). The same
# bits as `release` (no fast-math, the same opt-level; the golden tests and the parity smoke tier
# pass on it, validation/investigations/release-0.1/README.md). Everyday builds, CI, verify-merge
# and the agents keep `release`: fat LTO adds minutes of single-threaded linking.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
