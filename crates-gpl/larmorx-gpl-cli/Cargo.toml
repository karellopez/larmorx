[package]
name = "larmorx-gpl-cli"
description = "The larmorx-gpl command line: bit-exact replicas of GPL-family tools (tedana's t2smap) with the original programs' arguments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# GPL-3.0-only: the program includes tedana's translation (larmorx-gpl-tedana, GPL-3.0-only), so
# the whole is under version 3 only (pyproject.toml, NOTICE); the workspace's tools are -or-later.
license = "GPL-3.0-only"
repository.workspace = true
autobins = false

[[bin]]
name = "larmorx-gpl"
path = "src/main.rs"

[dependencies]
larmorx-core.workspace = true
larmorx-gpl-tedana.workspace = true

[dev-dependencies]
flate2.workspace = true
sha2.workspace = true
tempfile.workspace = true
