# SPDX-License-Identifier: LicenseRef-FSL
# The FSL replica workspace (`larmorx-nc`, docs/licensing.md): bit-exact translations of FSL's
# source, distributed under the FSL Licence's terms (LICENSE: non-commercial use only, the
# licence passed on to every receiver, FSL's original and amended source included; fsl-source/).
#
# It is a separate Cargo workspace, so the Apache-2.0 workspace at the repository root never
# builds it and no Apache crate can depend on it. Its crates use the Apache crates by path
# (Apache-2.0 code may be included in this work, with its notices: LICENSES/). It never links
# the GPL workspace (crates-gpl/): the FSL Licence's conditions and the GPL exclude each other.
[workspace]
resolver = "3"
members = [
    "larmorx-nc-core",
    "larmorx-nc-core/tools/glibc-float-verify",
    "larmorx-nc-core/tools/affine-trace-replay",
    "larmorx-nc-mcflirt",
    "larmorx-nc-bet",
    "larmorx-nc-core/tools/libm-verify",
    "larmorx-nc-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "LicenseRef-FSL"
repository = "https://github.com/karellopez/larmorx"

# Pure-Rust dependencies only (CLAUDE.md rule 5): no C, C++, Fortran or HDF5 libraries.
[workspace.dependencies]
larmorx-core = { path = "../crates/larmorx-core", version = "0.0.1" }
larmorx-nc-core = { path = "larmorx-nc-core", version = "0.0.1" }
larmorx-nc-mcflirt = { path = "larmorx-nc-mcflirt", version = "0.0.1" }
larmorx-nc-bet = { path = "larmorx-nc-bet", version = "0.0.1" }
# zlib-rs: the pure-Rust zlib implementation (no C zlib), as the root workspace.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
# znzlib 2511.3 (FSL 6.0.7.23) also reads and writes zstd and bzip2: ruzstd (pure-Rust zstd) and
# bzip2 with its default libbz2-rs-sys backend (a pure-Rust bzip2; no C bzip2).
ruzstd = "0.9.1"
bzip2 = "0.6.1"
rayon = "1.12.0"
thiserror = "2.0.21"
tempfile = "3.27.0"
# Test-only: SHA-256 for the golden tests (larmorx-nc-cli/tests/golden.rs).
sha2 = { version = "0.11.0", default-features = false }

# The golden tests run the debug build (CI's `cargo test`, docs/validation/golden.md). BET's
# surface deformation (1000 iterations over 2,562 vertices, up to 11 passes, several bet2 runs per
# `bet` case) took 130 s of them unoptimised and 28 s at opt-level 1 on Linux x86_64; so the FSL
# core and BET are built at opt-level 1 in the dev profile. Debug assertions and overflow checks
# stay on (separate settings); the bits are the same (no fast-math; the NaN matrices of
# validation/probes/ compare release builds with unoptimised debug builds, made with
# `--config 'profile.dev.package.larmorx-nc-core.opt-level=0'` and the same for larmorx-nc-bet).
[profile.dev.package.larmorx-nc-core]
opt-level = 1

[profile.dev.package.larmorx-nc-bet]
opt-level = 1
