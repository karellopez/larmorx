# The FSL-licensed replica workspace, `larmorx-nc` (docs/licensing.md): replicas translated from
# FSL's source, under the FSL Licence's terms (non-commercial, the licence passed on, FSL's
# original source included in fsl-source/). It is a separate Cargo workspace, so the Apache-2.0
# workspace at the repository root never builds it, and no Apache crate can depend on it. Its
# crates may depend on the Apache crates; the reverse is forbidden. It never links crates-gpl
# (the FSL Licence and the GPL are incompatible).
#
# This file is the BET part's minimal workspace (larmorx-nc-bet); the mcflirt part creates the
# package's full workspace (larmorx-nc-core, larmorx-nc-cli, packaging) at the same time, and the
# two are joined at the merge.
[workspace]
resolver = "3"
members = [
    "larmorx-nc-bet",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "LicenseRef-FSL"
repository = "https://github.com/karellopez/larmorx"

# Pure-Rust dependencies only (CLAUDE.md rule 5): no C, C++, Fortran or HDF5 libraries.
[workspace.dependencies]
larmorx-core = { path = "../crates/larmorx-core", version = "0.0.1" }
larmorx-nc-bet = { path = "larmorx-nc-bet", version = "0.0.1" }
# zlib-rs: the pure-Rust zlib implementation (no C zlib), as the root workspace uses it.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
tempfile = "3.27.0"
# Test-only: SHA-256 for the golden tests (larmorx-nc-bet/tests/golden.rs).
sha2 = { version = "0.11.0", default-features = false }
