[package]
name = "larmorx-nc-bet"
description = "Bit-exact replicas of FSL's BET (bet, bet2, betsurf) for larmorx, translated from FSL 6.0.7.17's source (FSL Licence: non-commercial)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

# A small program for the parity suite and the golden tests until the package's own
# `larmorx-nc` program (larmorx-nc-cli) dispatches to this crate: it takes the same arguments,
# `larmorx-nc-bet fsl <bet|bet2|betsurf> [original arguments]`.
[[bin]]
name = "larmorx-nc-bet"
path = "src/bin/larmorx-nc-bet.rs"

[dependencies]
larmorx-core.workspace = true
flate2.workspace = true

[features]
# Exposes private routines to the bit-exactness harnesses in tools/ (not an API).
verification = []

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
