[package]
name = "larmorx-nc-core"
description = "The shared core of larmorx's FSL replicas: FSL's newimage, miscmaths, NIfTI and Armadillo arithmetic, translated bit for bit (FSL Licence: non-commercial)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
larmorx-core.workspace = true
flate2.workspace = true
ruzstd.workspace = true
bzip2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Probes only, never in a release build: the FFT's twiddle factors read from the file
# LARMORX_PROBE_FFT_TWIDDLES names (Armadillo's own, validation/probes/fsl-avwutils-lib).
probe-twiddles = []
