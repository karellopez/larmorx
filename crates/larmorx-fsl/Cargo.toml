[package]
name = "larmorx-fsl"
description = "Clean-room FSL-compatible tools for larmorx (BET's brain extraction), written from behaviour specs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
larmorx-core.workspace = true
larmorx-io.workspace = true
# FSL 6.0.7.23's image names, compressions and reading, shared with the clean-room mcflirt.
larmorx-mri.workspace = true
# Unused since 2026-10-30 (part 2a): tanh is larmorx_core::math's (tanh_glibc for FSL's bits,
# tanh correctly rounded). Its removal changes the three workspaces' lockfiles: left to the merge.
rayon.workspace = true
bytemuck.workspace = true

[dev-dependencies]
tempfile.workspace = true
