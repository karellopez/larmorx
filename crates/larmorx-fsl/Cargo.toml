[package]
name = "larmorx-fsl"
description = "Clean-room FSL-compatible tools for larmorx (BET's brain extraction and betsurf), written from behaviour specs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
larmorx-core.workspace = true
larmorx-io.workspace = true
# FSL 6.0.7.23's image names, compressions and reading, shared with the clean-room mcflirt.
larmorx-mri.workspace = true
rayon.workspace = true
bytemuck.workspace = true
# fslmaths' erf and erfc (FreeBSD's msun in pure Rust): larmorx_core::math has no erf yet
libm.workspace = true
# the coordinate programs read only an image's header bytes (pure Rust: zlib-rs, bzip2's Rust
# backend), as FSL does
flate2.workspace = true
bzip2.workspace = true
# FSL's standard images checked by their SHA-256 (specs/bet.md §5.4: larmorx-nc's copy, the
# cached download of FSL's data package)
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
