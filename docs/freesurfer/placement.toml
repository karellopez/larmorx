[[piece]]
id = "P-15"
piece = "the C library's behaviours: drand48/srand48, rand/srand/srandom (random_r), qsort, the libm functions"
findings = ["TP-15"]
where = ["AntsN4BiasFieldCorrectionFs.cpp (srand48(53))", "utils/pdf.cpp", "utils/mri.cpp", "mri_robust_template.cpp", "utils/utils.cpp (setRandomSeed)", "82 qsort calls in 35 reached files", "every exp, log, pow, sin call (the host's libm.so.6)"]
licence = "glibc 2.35: LGPL-2.1-or-later; drand48: POSIX's published definition"
terms = "LGPL-2.1 section 6 (see P-09); LARMORX's rule 2: glibc is never copied or translated, behaviour specs only"
runs = "N4's zero replacement option, noise options, mri_robust_template without --inittp; qsort's order of equal keys wherever FreeSurfer sorts; libm in every program"
link = "dynamic (libc.so.6, libm.so.6)"
replica_package = "larmorx, from definitions and behaviour specs (drand48 from POSIX; random_r, qsort and the libm functions not yet covered by larmorx_core::math from specs)"
combinable = "yes"
basis = "LGPL-2.1 section 6 with dynamic linking, as the official binaries do; a translation would have to stay a separate LGPL library, which rule 2 avoids"
freesurfer_replica_uses = "the spec-written functions (larmorx_core::math's *_glibc and its specs)"
clean_room = "larmorx"
permission = ""
larmorx_today = "larmorx_core::math (*_glibc from Arm's MIT routines and fdlibm; cbrtf and the double sin/cos from specs)"

