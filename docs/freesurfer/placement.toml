# CLOSED TO FREESURFER CLEAN-ROOM IMPLEMENTERS: written from FreeSurfer 8.2.0's source and its third-party
# pieces (docs/freesurfer/README.md). The placement table of sub-task 3b (the user's decision of 2026-11-12,
# decision log "FreeSurfer's borrowed pieces and its two streams"): for every third-party piece of
# third-party.md, its licence, the package its replica would live in, whether that licence and FreeSurfer's
# may be combined in one program, the process boundary where there is one, what larmorx-freesurfer's replica
# uses where they may not be combined, and the permission still needed. Written by hand by relay 5; the prose
# and the reasons are in third-party.md section 9. Facts and options only: the user decides.
#
# Fields of [[piece]]:
#   id, piece, findings (third-party.md's TP-xx), where (FreeSurfer's files), licence, terms (the relevant
#   words of the piece's licence), runs (on a default path: which programs), link (begins with "in-process": compiled
#   into the FreeSurfer program that uses it; "separate-program": run by a FreeSurfer script as its own
#   program; or "dynamic": a shared library of the system; a note in brackets may follow), replica_package (the package of the piece's own licence family), combinable (with FreeSurfer's
#   licence in one program: "yes", "yes-noncommercial" (the program as a whole then carries the piece's
#   non-commercial terms), "no" (the cautious reading of both texts), "no-permission", "depends" (on which
#   of the piece's terms is used: see basis)), basis (why),
#   freesurfer_replica_uses (what larmorx-freesurfer's replica of the calling program uses for this part),
#   clean_room ("larmorx" for every piece, the user's decision), permission (from whom, when one is needed),
#   options (for the user, where the facts leave a choice), larmorx_today (what LARMORX already has),
#   decided (where the user has decided the piece's placement: who, when, what; the other fields then follow it).

schema = 1
freesurfer = "8.2.0"
written = "2026-11-12"

[freesurfer_licence]
name = "FreeSurfer Software License Agreement, version 1.0 (February 2011), LICENSE.txt"
grant = "B.1: MGH grants 'with respect to MGH's rights in the software' a licence 'to use, reproduce, make derivative works of, display and distribute the Software', provided that (b) 'in connection with any copy of or sublicense of all or any portion of the Software, all of the terms and conditions in this Software License shall appear in and shall apply to such copy and such sublicense', with the required preface"
not_reciprocal = "B.2: 'the right to (i) incorporate the Software into proprietary programs (subject to any restrictions applicable to such programs), (ii) add your own copyright statement to your modifications of the Software, and (iii) provide additional or different license terms and conditions in your sublicenses of modifications of the Software'"
third_party = "B.3: 'This Software License does not grant any rights with respect to third party software, except those rights that MGH has been authorized by a third party to grant to you'"
terms_beyond_notices = "B.4 research use acknowledged, compliance with export and import laws; B.5 'YOU FURTHER ASSUME ALL LIABILITY ... AND AGREE TO INDEMNIFY AND HOLD HARMLESS MGH AND ALL CONTRIBUTORS'; B.6 no use of names; B.7 automatic revocation; Part C Massachusetts law"
contributions = "A.6: each contributor warrants that the contribution 'DOES NOT CONTAIN ANY CODE THAT REQURES OR PRESCRIBES AN \"OPEN SOURCE LICENSE\" FOR DERIVATIVE WORKS (by way of non-limiting example, the GNU General Public License ...)'"
reading = "FreeSurfer's terms bind MGH's portions wherever they go and ask nothing of the code combined with them (B.2), so any licence that lets its code sit in a program under other terms combines with them; a licence that requires the whole program to be under it with no further restrictions (the GPL) does not, because B.1(b) makes B.4, B.5, B.7 and Part C apply to MGH's portions inside that program"

