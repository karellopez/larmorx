# CLOSED TO FREESURFER CLEAN-ROOM IMPLEMENTERS: written from FreeSurfer's source (docs/freesurfer/README.md).
#
# Every program recon-all 8.2.0 runs in its two streams (v8, the default; classic, -no-v8) and every
# FreeSurfer program fMRIPrep 25.2.6 / sMRIPrep 0.19.2 / niworkflows 1.15.2 run outside it; the prose,
# the reasons and the line numbers are in programs.md. Relay 1 of FreeSurfer's preparation,
# 2026-11-12, from the script; to be checked against the recordings.
#
# Fields of each [[program]]:
#   name       the program as called
#   kind       c++ | c | c+fortran | tcsh | csh | python | python-network | system | minc
#   source     its main file under <workspace>/tags/freesurfer-8.2.0 ("" when not in the tree)
#   streams    v8, classic, fmriprep (the stages of programs.md run it in that stream; "fmriprep" =
#              called by fMRIPrep/sMRIPrep outside recon-all, or by a script they call)
#   called_by  recon-all, a script's name, or the fMRIPrep component
#   run        timed (a recorded step), bare (seen only as a change between steps), nested (timed
#              inside a script's step), mixed (more than one of these), conditional (not on the
#              default path of the reference runs)
#   stages     the stage numbers of programs.md §3 (recon-all -all), or "fmriprep"
#   uses       the argument forms used (paths shortened as in programs.md)
#   plan_wave  the wave docs/freesurfer-plan.md gives it ("" when the plan does not name it;
#              sub-task 6 assigns every program)
#   notes      anything the porting card needs from this reading

schema = 1
freesurfer = "8.2.0"
fmriprep = "25.2.6"
smriprep = "0.19.2"
niworkflows = "1.15.2"
nipype = "1.12.0"

# ---------------------------------------------------------------- the driver

[[program]]
name = "recon-all"
kind = "tcsh"
source = "scripts/recon-all"
streams = ["v8", "classic", "fmriprep"]
called_by = ["user", "sMRIPrep ReconAll"]
run = "driver"
stages = []
uses = ["-all -s <subj> -i <T1w> -openmp 4 -itkthreads 4 [-no-v8]", "sMRIPrep: -autorecon1 -noskullstrip -noT2pial -noFLAIRpial [-cw256] [-hires] [-T2|-FLAIR] -i <T1w ref> -openmp N", "-gcareg", "-autorecon2-volonly", "-autorecon-hemi lh|rh -noparcstats -noparcstats2 -noparcstats3 -nohyporelabel -nobalabels", "-cortribbon -parallel [-T2pial|-FLAIRpial]", "-autorecon-hemi lh|rh -nohyporelabel", "-autorecon3"]
plan_wave = "3.6"
notes = "10,128 lines; reads etc/recon-config.yaml (rca-config) and, in v8, etc/global-expert-options.v8.txt; copies itself to scripts/recon-all.local-copy"

# ---------------------------------------------------------------- volumes (C++)

[[program]]
name = "mri_convert"
kind = "c++"
source = "mri_convert/mri_convert.cpp"
streams = ["v8", "classic", "fmriprep"]
called_by = ["recon-all", "mri_nu_correct.mni", "talairach_avi", "fs-synthmorph-reg", "mri_mcadura_seg", "mri_vsinus_seg", "seg2cc", "fscalc", "bbregister", "niworkflows check_valid_fs_license"]
run = "mixed"
stages = ["1", "3", "10", "11", "16", "17", "20", "21", "fmriprep"]
uses = ["<T1w> mri/orig/001.mgz", "rawavg.mgz orig.mgz --conform", "nu0.mgz <out> --like <in>", "<in> talsrcimg.img", "-rt nearest <in> -at <warp> test.nii.gz", "<crop> --left-right-reverse-pix <out>", "<seg> <out> --left-right-swap-label-table <lh> <rh> --left-right-reverse-pix", "<sentinel.nii.gz> out.mgz"]
plan_wave = "3.2"
notes = "classic: --conform in a fresh orig; non-N4 path would also write MINC (mnc)"

