kind = "permissive; spec + clean room (glibc's part)"
what = "random numbers: VXL's vnl_random (Marsaglia-Zaman, drand64's measured left-to-right order, TP-01) and POSIX drand48/srand48/erand48 (TP-15), ported from their own sources; glibc 2.35's rand, srand, random and srandom from a behaviour spec only (specs/glibc-random.md by a spec writer, then a clean-room implementer: the GNU family's precedent, specs/glibc-dbl.md; not the permissive track's part); FreeSurfer's setRandomSeed and randomNumber come with fs.core"
