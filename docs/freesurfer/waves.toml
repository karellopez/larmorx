checks = "three programs built from it give the official binaries' outputs on recorded steps (mri_add_xform_to_header, mri_normalize, mris_smooth)"

[[item]]
id = "3.1-03"
wave = "3.1"
kind = "permissive"
what = "x87 80-bit extended arithmetic (long double on x86-64 Linux): add, subtract, multiply, divide, square root, conversions to and from float, double and integers, comparisons, at the Linux default precision control (64-bit significand, round-to-nearest-even), written from Intel's manual and IEEE 754's extended format (no FreeSurfer code); used by MRIgaussianSmoothNI, dmatrix, surfgrad and gifticlib's writer (variation.md section 1)"
