[[item]]
id = "3.1-02"
wave = "3.1"
kind = "oracle"
what = "a unit oracle: FreeSurfer 8.2.0's libutils and the packages it links, built from the tag with GCC 8.4.0 (oracles/toolchains/gcc-8.4) and the official flags (code.toml) against ITK 4.13.2's VNL, with a harness that calls single functions (the foundations' checks below; a proposal: the replay checks whole programs only)"
