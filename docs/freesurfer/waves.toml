inputs = "Intel 64 and IA-32 Architectures Software Developer's Manual, vol. 1 ch. 4 and 8"
checks = "random operands and the 12 reached functions' patterns against the machine's x87 (a C probe compiled by GCC 8.4.0); golden cases on the six platforms"

[[item]]
