# ---------------------------------------------------------------- the register (summary row only)
# FSL-111: a new entry (found by black-box runs of FSL 6.0.7.23's applyxfm4D, relay 6). If FAST's
# replica (FSL-96 to FSL-110) is merged first, move this row after FSL-110's.
[[op]]
do = "insert"
file = "docs/findings/upstream-defects.md"
after = "| FSL-93 †"
text = '''| FSL-111 | applyxfm4D (8-bit unsigned images) | an image stored as uint8 is read as signed bytes: its values 128 to 255 are taken as v − 256 (255 as −1), so the interpolation between values on both sides of 127/128, the background value (the border's 10th percentile) and the spline's coefficients are those of the negative values (a profile 100, 140 interpolated 0.4 of the way gives 13, not 116); nearest neighbour writes the stored bytes back (the output's conversion wraps them to bytes) but for the padding voxels; `flirt -applyxfm` reads the same image as stored | c | none (fMRIPrep resamples with its own resampler) | rule A: read as stored by default in the clean-room original, FSL's reading with `reproduce`, named where a written value changes (2026-11-02); the replica reads them as FSL does in both modes | replica |'''

