text = '''| GLIBC-07 | glibc 2.35 | the double-precision `sin`, `cos`, `tan`, `asin`, `acos`, `atan`, `exp`, `log` and `pow` are not correctly rounded (on image intensities, of 6.7 × 10^7 arguments each, one unit in the last place on: `sin` 0.12 %, `cos` 0.085 %, `tan` 0.21 %, `asin` 0.16 %, `acos` 0.071 %, `atan` 0.083 %, `exp` 0.076 %, `log` 0.021 %, `pow` 0.083 %), nor is `sincos` (0.148 % of the FFT's twiddle angles), which gives the twiddle factors of fslmaths' FFT convolution through `cexp` (of the transform lengths 1 to 256, 80 hold a factor one unit away from the exact one): fslmaths' `-sin` ... `-pow` of a double image (`-dt double`; no float result differs) and a few voxels of an FFT convolution (random testing met it once in 114,906 fslmaths cases). glibc chooses an FMA build of each of the nine functions at run time on x86-64 CPUs with FMA (every one since 2013, the oracle machines too), and the two builds differ from each other: FSL's own double results depend on the CPU; "glibc's bits" here means the FMA build's (the orchestrator's decision, 2026-11-03); `sincos` has one build | d | none (fMRIPrep's fslmaths calls compute in float, and its `-s` convolves by separable sums) | correctly rounded by default (CORE-MATH, its `tan` ported 2026-11-03); `reproduce` gives glibc's bits (the FMA build's) for `exp`, `log` and `pow` (Arm's Optimized Routines, the code glibc ships), named where they change a voxel; `sin`, `cos`, `tan`, `asin`, `acos`, `atan` and `sincos` are IBM's Accurate Mathematical Library in glibc (LGPL, never translated): correctly rounded in both modes, the record's two cases (`fn/double-tan`, `difftest/fft-twiddles-glibc-sincos`) expected divergences; fslmaths' replica 2026-11-03 | reproduce (the six IBM functions and `sincos`: by the `cbrtf` route, GLIBC-05, when scheduled) |'''

