[[op]]
do = "insert"
file = "docs/findings/upstream-defects.md"
after = "| FSL-143 †"
text = "| FSL-144 | applytopup (`--method=jac`, a phase encoding along z) | a phase-encoding vector with a z component (which topup refuses: it estimates no field along z) has that component left out of the displacement: an image encoded along z is written uncorrected, silently | c | none (fMRIPrep corrects with its own resampler) | rule B: refused by default in the clean-room original, named; FSL's output with `reproduce` (2026-11-03, `at/jac-z`); the replica gives FSL's output in both modes | replica |\n| FSL-145 | topup (`--splineorder=2`) | an axis shorter than two knot spacings gets two quadratic B-spline coefficients (every other axis ceil((2n + k − 4) / 2k) + 2): the field's support ends inside the axis and it is forced towards 0 at its far end | c | none (fMRIPrep's configuration uses cubic splines) | rule A: the general count by default in the clean-room original, named; FSL's two with `reproduce` (2026-11-03, found by random testing: `difftest/fsl145-short-axis`); the replica lays FSL's two in both modes | replica |\n| FSL-146 | topup (volumes encoded along different axes: AP, PA, LR, RL) | the cost's gradient leaves out of each axis' Jacobian term the volumes not encoded along that axis, so it is not the cost's gradient: the minimisers step in a wrong direction (a first Levenberg-Marquardt step can raise the cost) and stop where the false gradient vanishes | c | rare (sdcflows' PEPOLAR estimation from field maps along two axes; none in the oracle runs) | rule A, measured: the cost's own gradient by default in the clean-room original, named (its final cost as low as FSL's or lower in 86 to 89 % of random testing's differing four-volume cases); FSL's with `reproduce` (2026-11-03, found by random testing: `difftest/fsl146-mixed-axes`); the replica keeps FSL's in both modes | replica |"

