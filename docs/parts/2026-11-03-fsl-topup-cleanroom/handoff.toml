# topup's clean-room original (relays 1 to 6): the exact changes to the shared documents.
# Apply from the larmorx checkout: python -P scripts/orchestration/apply_handoff.py <this> --site <site>

[[op]]
do = "block"
kind = "tool"
id = "fsl-topup"
text = "[[tool]]\nid = \"fsl-topup\"\ntitle = \"topup and applytopup (the susceptibility field from reversed phase encodings, and its correction)\"\neco = \"fsl\"\npage = \"/tools/fsl-topup/\"\nuse = [\"larmorx fsl topup\", \"larmorx fsl applytopup\", \"lx.fsl.topup\", \"lx.fsl.applytopup\"]\nhow = \"clean-room original, `experimental` (2026-11-03: every option, message and failure case of both programs, applytopup's undocumented vb2D, vb3D and vb4D included; fMRIPrep's call 10 to 12 times FSL's speed on one thread, 39 to 41 times on 14, the same bits at any thread count); exact replica in `larmorx-nc` (FSL Licence, non-commercial), `experimental` (2026-11-03: the same programs, options and methods)\"\nvalidation = \"original: [{fsl-topup.pass} of {fsl-topup.compared}](record:fsl-topup) compared cases within thresholds against FSL 6.0.7.23 (fMRIPrep's call on {fsl-topup.fmriprep} oracle runs: ds001600 within FSL's own thread band in every metric, ds005040 in every one but the field's correlation, 0.999958 against FSL's own 0.999966), {fsl-topup.both} more rejected by both alike, {fsl-topup.expected} expected divergences, each with its reason (estimated movements that do not converge, where FSL's rotation derivatives are not its cost's; FSL-133's lines; FSL-143's diverging iterations, reproduced; inputs refused for FSL-124 and FSL-134); replica: [{fsl-topup-replica.pass} of {fsl-topup-replica.compared}](record:fsl-topup-replica) compared cases bit-identical to FSL 6.0.7.23 (every file written, the printed messages, the exit status): fMRIPrep's call on {fsl-topup-replica.fmriprep} oracle runs, every option, FSL's configurations, applytopup's five methods; {fsl-topup-replica.both} more rejected by both alike; {fsl-topup-replica.expected} refused where FSL needs more memory than any machine holds (a negative --warpres, FSL-124) or reads a field on another grid past its lines (FSL-134)\""

[[op]]
do = "insert"
file = "validation/tools.toml"
after = "status = \"`experimental` ({fsl-fast-replica.pass}"
