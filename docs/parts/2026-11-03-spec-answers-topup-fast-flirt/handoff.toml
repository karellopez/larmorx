[[op]]
do = "append"
file = "docs/findings/upstream-defects.md"
text = """### FSL-201 to FSL-204, and the source of FSL-144 to FSL-146: the spec answers for topup, FAST and FLIRT (FSL 6.0.7.23) †

Found or explained answering the clean-room originals' questions (2026-11-03; the restricted
findings `docs/findings/fsl-topup.md`, `fsl-fast.md` and `fsl-flirt.md`, "The spec answers of
2026-11-03", have the source lines; the models and measurements are in
`validation/investigations/spec-answers-3/`). FSL-201: `TopupScan::GetMovementDerivative` takes
a forward difference of the sampling positions (`tiny` 1e-4 for the translations, 1e-5 for the
rotations) through `MovePar2Matrix` → `construct_rotmat_euler` → `make_rot`, whose `float theta
= norm2(angl)` makes the angle, its cosine and sine single-precision values and the axis entry
`q²` not 1; the rounding divided by the step is the defect, and `TopupCF::grad`,
`TopupCF::hess`'s interaction block and the movement Hessian all use it (`rotation_model.py`
gives the rotation entries of FSL's three gradients of `debug/movements` to 2e-5 to 1.5e-4;
`measure_fsl201.py` measured the final costs); the replica's default differentiates `Rᵀ(y − c −
t) + c` analytically with correctly rounded `sin` and `cos`. FSL-202: `MeansVariances`'
`m_mean[c]*m_mean[c]` is the float square of the float mean, subtracted from the double second
moment (`variance_measure.py`, `variance_reference.py`; the measurement hooks in
`crates-nc/larmorx-nc-fast/dev-patches/`); the replica's default stores `(s_mpm / s_p2 − μ·μ)`
with `μ = s_mp / s_p` in double. FSL-203: newimage's `calculateExtrema` seeds both extrema with
the first element (every FSL tool's `min()` and `max()` share it; whether a NaN first voxel
changes BET's, FLIRT's or fslmaths' results is not checked). FSL-204: pointflirt's count test
passes two 0 × 0 matrices and the later submatrix copies of the empty products crash. The source
of three black-box entries (their behaviour: the summary's rows): FSL-144, `jac_resample` leaves
the z displacement 0; FSL-145, `Spline1D::NCoef`'s loop test subtracts the unsigned
`KernelSize()/2` from the signed offset, so the loop does not run when `(nc − 1)·ksp <
KernelSize()/2` (one coefficient when the axis is shorter than one spacing, two when shorter than
two at spacings of 3 and more, at a spacing of 2 only an axis of one voxel), and a refit of a
single coefficient indexes the penalty's rows at −1 (Armadillo's `Mat::operator(): index out of
bounds`); FSL-146, `TopupCF::grad` tests `_sm.HasBeta(i)` (and `HasGamma(i)`) per scan where the
Hessian tests the manager's `HasBeta()` (any scan). FSL-125 and FSL-134 refined:
`gaussian_kernel1D` returns the identity for a width of at most 1e-6 (a negative `--fwhm`
smooths nothing); `jac_resample` assigns a field of another shape through a ShadowVolume in
storage order and writes its Jacobian at the field's own indices (writes outside the image go to
the zero-pad extrapolation value). Cases: the replicas' records `fsl-topup-replica` (the 37
cases that estimate the movements; `at/jac-z`, `opt/fsl145-short-axis`,
`opt/fsl145-one-coefficient`, `opt/fsl146-four-axes`), `fsl-fast-replica` (every single-channel
case; `opt/nan-first`) and `fsl-flirt-replica` (`programs/applyxfm4D-uint8`,
`programs/applyxfm4D-uint8-3d-spline`, `programs/pointflirt-no-points`)."""

