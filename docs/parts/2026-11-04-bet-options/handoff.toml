file = "docs/findings/upstream-defects.md"
text = "### FSL-211 to FSL-217: standard_space_roi, fslroi and `bet -S`, `-B`, `-A`, `-A2` (FSL 6.0.7.23) †\n\nFound while translating FSL 6.0.7.23's `standard_space_roi` (fsl-flirt 2111.4), `fslroi`\n(fsl-avwutils 2209.6) and the `bet` script's variations (fsl-bet2 2111.9) for the replica\n(2026-11-04; the restricted findings `docs/findings/fsl-flirt.md`, \"standard_space_roi and\nfslroi\", and `docs/findings/fsl-bet.md`, \"`bet -S`, `-B`, `-A`, `-A2`\", have the lines and FSL's\nruns). FSL-211: the script expands `$1`, `$2`, `$in`, `$out`, `$standard`, `$inapply`, the masks\nand `$@` unquoted (`imtest` prints 0 for more than one word; `[` prints `too many arguments` and\nthe option loop ends; FLIRT's options are split again); an empty input makes `remove_ext` print\nits usage, which becomes the input's name. FSL-212: `/bin/rm ${out}_tmp*` (line 248). FSL-213:\nonly `-b` sets `maskthr`, which line 226 applies (`fslmaths ... $maskthr ...`), so bash takes any\nvalue from the environment. FSL-214: no `-e` and no status test: after a failed program the rest\nruns on missing files and the exit status is the cleanup's (`rm`'s, or 0 with `-d`); bash reports\nan aborted program at its line, or at the `fi` of the `if` block it runs in (229, 242). FSL-215:\nfslroi's `main` catches newimage's exceptions, prints `what()` after the `Image Exception : #n ::\nmsg` line and falls off its end (exit 0) after `Invalid ROI dimensions` (#21), `Out of Bounds (time\nindex)` (#5) and `No image files match` (#63). FSL-216: ``thr=`echo \"10 k 3.5 $SD * $Mean + p\" |\ndc` `` (`bet:290`) on what `fslstats -M` and `-S` print in `cout`'s default format (6 significant\ndigits): an exponent's `e` (GNU dc 1.4.1: `dc: ` on standard error, `'e' (0145) unimplemented` on\nstandard output, into `thr`), a minus sign (a subtraction), `nan` and `inf` (dc's `n`, `a`, `i`,\n`f`). FSL-217: newimage's `closestTemplatedType` maps `DT_INT8` to `DT_UNSIGNED_CHAR`, so fslroi\nand fslmerge (`bet -Z`'s slices, `bet -F`'s first volume) save an int8 image as uint8 with the same\nbytes. FSL-63 has a second site, `bet:388` (`-B -s`). Cases: the replica's record\n`fsl-bet-replica` (its `fslroi/`, `ssroi/` and `defects/` categories, `bet/fmri-int8`,\n`bet/small-fov-int8`, `defects/eyes-threshold-exponent`, `defects/bias-skull-echo`); the unit\ntests `bet::tests::eye_threshold_fsl_216` and `fslroi::tests::an_int8_input_keeps_its_type_by_default`."

