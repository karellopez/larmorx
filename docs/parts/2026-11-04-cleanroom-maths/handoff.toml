# fslmaths' and fslstats' clean-room originals: the exact changes to the shared documents
# (scripts/orchestration/apply_handoff.py). The reasons are in HANDOFF.md.

[[op]]
do = "block"
kind = "tool"
id = "fsl-maths"
text = '''
[[tool]]
id = "fsl-maths"
title = "fslmaths (image arithmetic, thresholds, filters, reductions, statistics, TFCE)"
eco = "fsl"
page = "/tools/fsl-maths/"
use = ["larmorx fsl fslmaths", "lx.fsl.fslmaths", "lx.fsl.smooth", "lx.fsl.threshold"]
how = "clean-room original, `experimental` (2026-11-04: every operation, option, data type, message and failure case, FSL-191 to FSL-193 found by its black-box runs; 1.8 to 28 times FSL's speed on one thread, up to 268 times on 14, the same bits at any thread count); exact replica in `larmorx-nc` (FSL Licence, non-commercial), `experimental` (2026-11-03: every operation, option, data type, message and failure case)"
validation = "original: [{fsl-maths.pass} of {fsl-maths.compared}](record:fsl-maths) compared cases within thresholds against FSL 6.0.7.23, {fsl-maths.identical} of them FSL's values in every file (fMRIPrep's {fsl-maths.fmriprep} calls included; the others: FSL's FFT path, `-subsamp2` under the floating types, the last bits of Φ, the eigenvectors' signs, GLIBC-07), {fsl-maths.both} more rejected by both alike, {fsl-maths.expected} expected divergences (FSL's FFT convolution against the original's direct sum, `-subsamp2offc`'s means); replica: [{fsl-maths-replica.pass} of {fsl-maths-replica.compared}](record:fsl-maths-replica) compared cases bit-identical to FSL 6.0.7.23 (every file written, the printed messages, the exit status): fMRIPrep's {fsl-maths-replica.fmriprep} calls (combine_masks on three oracle runs, the goodvoxels mask's fourteen), every operation in every data type; {fsl-maths-replica.both} more rejected by both alike; {fsl-maths-replica.expected} one unit in the last place where FSL's glibc 2.35 is not correctly rounded and the replica is (GLIBC-07: `-dt double -tan`, an FFT's twiddle factors)"'''

[[op]]
do = "block"
kind = "tool"
id = "fsl-stats"
