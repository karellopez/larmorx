page = "/tools/fsl-stats/"
use = ["larmorx fsl fslstats", "lx.fsl.fslstats", "lx.fsl.image_mean", "lx.fsl.image_std"]
how = "clean-room original, `experimental` (2026-11-04: every option, `-t`, `-K` and `-json`, every message and failure case); exact replica in `larmorx-nc` (FSL Licence, non-commercial), `experimental` (2026-11-03: every option, `-t`, `-K` and `-json`, every message and failure case; BET's replica runs it)"
validation = "original: [{fsl-stats.pass} of {fsl-stats.compared}](record:fsl-stats) compared cases within thresholds against FSL 6.0.7.23, {fsl-stats.identical} of them FSL's numbers (fMRIPrep's {fsl-stats.fmriprep} goodvoxels calls included; BET's call within 6e-8 relative), {fsl-stats.both} more rejected by both alike; replica: [{fsl-stats-replica.pass} of {fsl-stats-replica.compared}](record:fsl-stats-replica) compared cases printing FSL 6.0.7.23's text byte for byte (with its messages and exit status): fMRIPrep's {fsl-stats-replica.fmriprep} goodvoxels calls, BET's call, FSL's own tests, every option; {fsl-stats-replica.both} more rejected by both alike"'''

