[[op]]
do = "insert"
file = "docs/orchestration.md"
after = "  5. Re-run the new or changed tool's standard-tier parity yourself"
text = '''  5a. **The clean-room audit** (the user, 2026-11-06: "the only thing most important to prove is that the agents did not look directly the source code"; [validation/clean-room-audit.md](validation/clean-room-audit.md)), on the committed merge, before the push: `scripts/orchestration/cleanroom-audit-merge.sh <checkout> <part> --scratch <the part's scratch folder> [--worktree <its worktree>] [--notes <its NOTES.md>] --summary` (about half a minute). It copies every transcript Claude Code holds that the archive lacks (the part's agents and the orchestrator's session; Claude Code deletes them after 30 days) into `<workspace>/archive/<date>-session-transcripts-<part>/` with their SHA-256 (an agent of the part without a transcript: exit 2), scans every transcript, makes the verdicts from the merged history and runs the gate. **Exit 1 stops the merge**: each `STOP` line is an edit of clean-room code by an agent after it had seen restricted material of that tool's family (an implementer's finding, or another role's edit: the orchestrator's own included), or a commit of clean-room code nobody's record made. Read the call in the dossier (`<workspace>/archive/clean-room-audit/<date>-<part>/verdicts/verdicts.md`, the call verbatim in `verbatim.md`); then either revert the edit (a fresh clean-room agent redoes it) or, when it carries nothing of the upstream (a title, behaviour the spec states, another family's lines, larmorx's own code), judge it in `validation/cleanroom-audit/judgements.toml` and re-run. `JUDGE` lines (slips of other families, headings, files a brief forbade) do not stop the merge: judge them the same way before the next one. With `--summary` the step regenerates `docs/validation/clean-room-audit.json` and `.md` (commit them with the merge; `lxv.sh . cleanroom-audit summary --check` verifies the page); add `--similarity` (about 15 minutes, boxed) when the part changed clean-room code, so the page's similarity figures cover it.'''

