| 2026-11-07 | **PRELUDE's clean-room original.** FSL's phase unwrapping written again from its behavioural specification and black-box runs of FSL alone, never its source, and built for speed: the regions merged in FSL's order through an indexed heap and a weighted union-find in place of FSL's scans, so fMRIPrep's two large calls run 97 and 211 times faster than FSL on one thread (2.5 to 2.8 times the replica's speed) and a 128³ map in 0.3 s against FSL's three minutes, the same bits at any thread count; every option, message and failure case: in its reproduce mode every file bit for bit FSL's, by default bit for bit the replica's corrected result (but the last bits of a few complex images' phases: the correctly rounded arctangent), in all 166 cases of its record (28 of them refused by both alike), fMRIPrep's seven calls included; FSL-261 to FSL-272 handled as the replica handles them. With it the other clean-room originals follow the specification answers of 2026-11-06: FLIRT's weighted correlation counts each point's weight as it goes (that registration now FSL's matrix exactly), topup's Jacobian with a coefficient field of other voxel sizes corrected by default (FSL-273), the head-motion correction's least squares as FLIRT's; and every FSL original writes a NIfTI pair's header and reads a series' time step as FSL does. [The page](/tools/fsl-prelude/) · [FLIRT](/tools/fsl-flirt/) · [topup](/tools/fsl-topup/) · [head-motion correction](/tools/mri-hmc/) |
'''
