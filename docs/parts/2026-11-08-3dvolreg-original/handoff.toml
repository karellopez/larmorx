reference = "3dvolreg (AFNI 26.3.05 binary, one thread: no OpenMP loop; through the oracle cache); the replica's default (a black box); fMRIPrep's calls also against fMRIPrep's own outputs (their medians)"
status = "`experimental` ({afni-volreg-original.pass} of {afni-volreg-original.compared} compared cases within `specs/3dvolreg.md` §14.3's limits, fMRIPrep's {afni-volreg-original.fmriprep} calls included; {afni-volreg-original.both} rejected by both, with the same messages and status; {afni-volreg-original.expected} expected divergences: larmorx writes no AFNI .HEAD/.BRIK dataset (twice) and refuses AFNI-96's short attribute, which AFNI reads past)"

[[record]]
id = "afni-volreg-replica"
'''

