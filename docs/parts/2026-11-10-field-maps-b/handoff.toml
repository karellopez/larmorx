le B: argparse's error (exit 2) |\n| SDC-35 | sdcflows' BIDS app | `larmorx sdcflows sdcflows` | the file is read with PyYAML's `load` without the `Loader` PyYAML 6 requires (`TypeError`) | rule A: accepted (it must exist; no effect) |\n| SDC-36 | sdcflows' BIDS app | `larmorx sdcflows sdcflows`, `lx.sdcflows.sdcflows_workflow` | one registry for every participant: two participants with the same `B0FieldIdentifier` (unique only within a participant in BIDS) stop it with `KeyError` | rule A: a registry per participant (the automatic names kept) |\n| SDC-37 | sdcflows `brain_masker` | `lx.sdcflows.brain_masker`, `brain_extraction`, `brainextraction_workflow` | the rough mask's largest component is the background (size 0): the whole image is the brain; a constant image divides 0 by 0 | rule B: a `ValueError` |\n| SDC-38 | sdcflows `brain_masker` | the same | with no seed left after the rough mask's erosion by `ball(5)` the random walker renumbers label 2 as 1 and the background's probability is taken as the brain's | rule B: a `ValueError` |\n| SDC-45 | sdcflows `FieldmapFile`, `find_anatomical_estimators` | `lx.sdcflows.FieldmapFile`, `FieldmapEstimation`, `find_estimators`, `find_anatomical_estimators`, `larmorx sdcflows sdcflows` | `FieldmapFile` parses its entities from the file's absolute path, where pybids' derivatives patterns (`den-`, `res-`, `desc-`, `label-`, ...) have no separator before them, and the fieldmap-less search queries the raw layout with every entity of its targets: a dataset below a folder such as `golden-clone` or `andres-lab` stops it with `ValueError: 'den' is not a recognized entity` | rule A: the entities of the path from the participant's `sub-*` folder (niworkflows' `relative_to_root`; a file below none keeps sdcflows' parse), with a warning when they changed |\n| SDC-46 | sdcflows `brain_masker` | `lx.sdcflows.brain_masker`, `brain_extraction` | the random walker's probabilities are cropped with `[..., padding:-padding, ...]`, an empty s