text = "| PIPE-18 | niworkflows `IntraModalMerge` | `lx.niworkflows.intra_modal_merge` | `grand_mean_scaling` indexes the series with a mask of the wrong shape: numpy's `IndexError` for every series of two or more volumes | rule A: each volume scaled by the largest median over its own in the mask, with a warning |\n| PIPE-19 | niworkflows `IntraModalMerge` | `lx.niworkflows.intra_modal_merge` | a 6- or 7-dimensional image passes the check for more than four dimensions and is averaged over its fourth axis | rule B: niworkflows' own error |\n| PIPE-20 | fMRIPrep `DistortionParameters` | `lx.transforms.distortion_parameters`; larmorprepx's `bold_fit_fieldmap`, `resampling_fieldmap` | a missing readout time or phase-encoding direction becomes undefined outputs: the run is resampled without its field map, the report still names the correction | the interface: rule C (its documented design) with a warning; larmorprepx's pipeline: rule B, fMRIPrep's own \"Missing readout time information\" error |\n| PIPE-21 | fMRIPrep `ReconstructFieldmap` | `lx.transforms.reconstruct_fieldmap` | the field on the target projected into the field map's space and made positive (a LAS target's voxels reversed), while the resampler reads it on the target's grid: up to 159 Hz on a synthetic LAS target | rule A: the values on the target's grid |\n| PIPE-23 | nipype `is_outlier` (`NonsteadyStatesDetector`) | `lx.niworkflows.is_outlier`, `nonsteady_states_detector` | a median absolute deviation of 0 makes the values at the median 0/0, NaN outliers: every leading volume non-steady | rule A: a z-score of 0 at the median |\n| PIPE-24 | niworkflows `ValidateImage` | `lx.niworkflows.validate_image` | nibabel's `get_xyzt_units` raises `KeyError` for a spatial unit code 4 to 7 | rule A: the translation reported in mm |\n| PIPE-25 | fMRIPrep `get_estimator` | larmorprepx's `map_fieldmap_estimation` | with several `B0FieldIdentifier` values on the sources, the estimator is named after one in a set's order; a run whose `B0FieldSource` is another gets none | rule A: the alias reaches its estimator, with a warning |\n| PIPE-26 | niworkflows `DerivativesDataSink` | `lx.niworkflows.derivatives_data_sink` | with two or more list-valued entity inputs the files are matched to the names in a Python `set`'s order | the entities' sorted order, with a warning (nondeterminism is never reproduced) |\n| PIPE-27 | niworkflows `DerivativesDataSink` | `lx.niworkflows.derivatives_data_sink` | \"from float32 to float32\": the original type named twice | rule A (a message): the new type |\n| PIPE-28 | niworkflows `DerivativesDataSink` | `lx.niworkflows.derivatives_data_sink` | fewer `compress` values than files (but more than one): Python's `IndexError` | rule B: a `ValueError` |\n| PIPE-29 | niworkflows `DerivativesDataSink` | `lx.niworkflows.derivatives_data_sink` | values out of the integer type's range and NaN cast with numpy's cast (undefined in C) | D13's rule: clamped (NaN to 0) with a warning |\n| PIPE-30 | niworkflows `DerivativesDataSink` | `lx.niworkflows.derivatives_data_sink` | the header fix sets four voxel sizes on an image that is not 4-D: nibabel's `HeaderDataError` | rule A: the fourth size only on a 4-D image, the sidecar with the value |\n| PIPE-31 | fMRIPrep `init_single_subject_wf` | larmorprepx's `split_precomputed`, `plan_fieldmap_estimation` | derivatives lacking the field map, reference or coefficients file stop the graph's construction with a bare `KeyError` | rule B: a `ValueError` naming the identifier and the files |\n| PIPE-32 | fMRIPrep `map_fieldmap_estimation` | larmorprepx's `map_fieldmap_estimation` | every participant of a run goes into sdcflows' one registry: a second participant with a `B0FieldIdentifier` an earlier one used stops it with `KeyError: \"'<id>' is already  in mapping\"` | rule A: each participant searched in its own registry (automatic names kept), entries added to the shared one where free, with a warning |\n| PIPE-33 | niworkflows `IntensityClip` | `lx.niworkflows.intensity_clip` (and the workflows that call it) | an image constant between its percentiles divided by its maximum, 0: NaN, cast to `int16`/`uint8` by an undefined conversion (0 on x86-64) | rule B: a `ValueError` |\n| PIPE-34 | niworkflows `RobustAverage` | `lx.niworkflows.robust_average` | a gathered volume whose mean is 0 after the clipping is divided by it: NaN or infinite voxels, registered and averaged | rule B: a `ValueError` naming the volumes |\n| PIPE-37 | pybids `BIDSLayout` (`BIDSLayoutIndexer`) | `lx.bids.BIDSLayout` (and every layout larmorx builds: larmorprepx's `fmriprep_layout`, `collect_fieldmaps`, the BIDS app) | the index matches the entity patterns against each file's absolute path (`Entity.match_file`): below a folder named `func`, `sub-pilot` or `run-2` every file gets `datatype` `func`, `subject` `pilot` (its own label lost) or `run` 2; with the derivatives configuration (unanchored `den-`, `res-`, `desc-`, ...) below `golden-x` or `andres-lab` every file gets `den` or `res` | rule A: the patterns matched against the path below the root (`/`-rooted, as the ignore patterns), with a warning when that changed an entity |\n| PIPE-40 | niworkflows `IntraModalMerge` | `lx.niworkflows.intra_modal_merge` | with `to_ras` the inputs are reoriented to RAS but `in_mask` is not, so `grand_mean_scaling` indexes the RAS series with the mask on the input's grid: numpy's `IndexError` when the shapes differ, a mirrored or permuted mask when they agree (its indexing fails anyway for two or more volumes: PIPE-18) | rule A: the mask reoriented with the series, with a notice |"

