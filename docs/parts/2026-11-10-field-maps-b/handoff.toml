text = "| SCI-09 | SciPy `rank_filter`, `median_filter`, `percentile_filter` | `lx.ndimage.rank_filter`, `median_filter`, `percentile_filter` | on a 1-D input the running rank takes the footprint's whole window, its false elements included | rule A: the n-dimensional filter, with a warning |\n| SCI-10 | SciPy binary morphology | `lx.ndimage.binary_erosion`, `binary_dilation`, `binary_opening`, `binary_closing`, `binary_propagation` | more than one pass: the first reads the mask's truth, the later ones the mask cast to `int8` (0.5, 256 false) | rule A: the truth in every pass, with a warning |\n| SCI-13 | SciPy `watershed_ift` | `lx.ndimage.watershed_ift`, `lx.sdcflows.epi_mask` | neighbours by C-order offsets checked only against the size: the last element of a row neighbours the first of the next | rule A, measured (rule D): corrected by default, `reproduce` SciPy's; `epi_mask`'s masks better on 3 of 4 oracle references against fMRIPrep's own BOLD masks, the same on 1 |\n| SCI-14 | SciPy `watershed_ift` | the same | an element alone in its queue is not taken out when its cost drops: queues join, elements are never processed or processed at the wrong level | rule A (with SCI-13's measurement): corrected by default, `reproduce` SciPy's |\n| SCI-15 | SciPy `watershed_ift` | `lx.ndimage.watershed_ift` | markers and labels read as C `int`s: `2**32 + 5` is 5 | rule A: 64 bits |\n| SCI-16 | SciPy `watershed_ift` | `lx.ndimage.watershed_ift` | above 2 GiB of input or output it reads and writes outside its arrays | 64-bit offsets in both modes, with a warning (never reproduced) |\n| SCI-18 | SciPy 1.18.1 `scipy.linalg.inv` | `larmorx.transforms._linalg.scipy_inv` (nilearn's `resample_img` in `lx.niworkflows.resample_img_nearest`, `generate_sampling_reference`) | for a general matrix whose norm (SciPy's `norm1_`) overflows, LAPACK `dgecon` returns `info = -5` without an estimate, `getri` is skipped and SciPy returns the LU factors as the inverse, with no error or warning | rule A: the inverse (`getri`, SciPy 1.15's result), with a notice |\n| SCI-21 | SciPy `rank_filter`, `median_filter`, `percentile_filter` (`_rank_filter_1d`) | `lx.ndimage.rank_filter`, `median_filter`, `percentile_filter` | for a float32, float64 or int64 1-D input SciPy hands its C++ the output array itself, which writes the input's type into it: an output of another type or byte order gets the bytes reinterpreted (`output=np.float32` of a float64 input, `\">f8\"`, an int16 array), past its end when its items are smaller (the heap corrupted: a crash at exit, or a hang) | rule A: the values cast into the output (SciPy's own handling of every other input type), with a notice |\n| SCI-22 | SciPy `rank_filter`, `median_filter`, `percentile_filter` (`_rank_filter_1d`) | the same | the type dispatch compares dtypes by equality with native ones: `>f4`/`>f8` inputs raise `RuntimeError(\"Unsupported array type\")`, numpy's `longlong` (another type number than `int64` on Linux and macOS) the C++'s `TypeError(\"Unsupported array type\")`; the n-dimensional filters take both | rule A: filtered (the native copy's result), with a notice |\n| SCI-23 | SciPy `rank_filter`, `median_filter`, `percentile_filter` (`_rank_filter_1d`) | the same | into a non-contiguous output of the input's type the C++ writes into numpy's `WRITEBACKIFCOPY` copy and drops it without resolving it: numpy writes it back and warns (`RuntimeWarning: WRITEBACKIFCOPY detected in clearing of array. ...`; numpy 2.3: `in array_dealloc.`) | rule A (the values are right; the warning reports SciPy's mistake): no warning by default |\n| SCI-25 | SciPy `binary_erosion`, `binary_closing` (`NI_BinaryErosion2`) | `lx.ndimage.binary_erosion`, `binary_closing` | for more than one pass with the structure's centre true and no `brute_force`, the later passes mark each element outside the mask by the first byte of its output element (restored at the end), which is 0 for both 0.0 and 1.0 in a float32 or float64 output array: those elements are eroded (`binary_erosion(ones(5), iterations=4, mask=[1, 1, 1, 0, 0], output=zeros(5))` gives `[0, 0, 0, 0, 1]`, a bool output `[0, 0, 0, 1, 1]`) | rule A: the outside elements kept (every other output type's result), with a notice when SciPy's differs |\n| SCI-26 | SciPy `binary_erosion`, `binary_dilation`, `binary_opening`, `binary_closing`, `binary_propagation`, `binary_fill_holes` (`Py_BinaryErosion2`) | `lx.ndimage.binary_erosion`, `binary_dilation`, `binary_opening`, `binary_closing`, `binary_propagation`, `binary_fill_holes` | the propagation strategy's second C call takes the output through `NI_ObjectToInputOutputArray` and never resolves its write-back copy: into a byte-swapped or misaligned output array numpy warns when the copy is freed (`RuntimeWarning: WRITEBACKIFCOPY detected in clearing of array. ...`; numpy 2.3: `in array_dealloc.`) and writes it back | rule A (the values are right): no warning by default |\n| SCI-27 | SciPy `label` (`_ni_label._label`) | `lx.ndimage.label` | Cython's typed buffers refuse a byte-swapped input or output (`ValueError: Big-endian buffer not supported on little-endian compiler`, also for `output=\">i4\"`), which every other function of `ndimage` takes (a big-endian NIfTI file's data are such an array) | rule A: labelled as the native copy (the labels written into a big-endian output), with a notice |\n| SCI-28 | SciPy `label` (`_ni_label._label`) | `lx.ndimage.label` | the labels are written through the output's data pointer whatever its flags | rule B: `ValueError(\"output array is read-only. ...\")` (SciPy's message for its other functions) |\n| SCI-29 | SciPy `label` (`_ni_label._label`) | `lx.ndimage.label` | a bool output is viewed as `uint8` and its overflow check passes up to 255, so labels above 1 are written as their bytes: a `bool` array holding 2, 3, ... (beyond 255 working labels SciPy retries and refuses, as for any type the labels do not fit) | rule A: labels above 1 refused as labels that do not fit (`insufficient bit-depth in requested output type`), with a notice |\n| SCI-30 | SciPy `sum_labels`, `sum`, `center_of_mass` (`_stats`) | `lx.ndimage.sum_labels`, `sum`, `center_of_mass` | with a 0-d index array SciPy indexes its sums with it (a numpy scalar) and assigns into it (`TypeError: 'numpy.int64' object does not support item assignment`); an empty input with a sequence index fails in `labels.min()` (`ValueError: zero-size array to reduction operation minimum which has no identity`) or, for `uint64` labels, in numpy's `IndexError` | rule A: the 0-d index's one sum as a scalar, the empty input's zero counts and sums of the index's shape, with a notice (one per `center_of_mass` call) |\n| SCI-31 | SciPy `binary_erosion`, `binary_dilation`, `binary_opening`, `binary_closing`, `binary_propagation` (`NI_BinaryErosion2`) | `lx.ndimage.binary_erosion`, `binary_dilation`, `binary_opening`, `binary_closing`, `binary_propagation` | the propagation strategy (iterations other than 1, the structure's centre true, no `brute_force`) casts the mask with `np.asarray(mask, dtype=np.int8)`, which returns the caller's own `int8` array, and uses it as its scratch: the mask is left `-1` where it was true and the first pass's output (its first byte) where it was false; `binary_closing`'s erosion then reads the overwritten mask, so its result differs (456 of 589 closings with an `int8` mask and more than one pass) | rule A: the caller's mask left as given, with a notice |"

