text = '''
### TED-31 and TED-46: t2smap (tedana 26.0.3), found by the clean-room part

Found by the clean-room original's black-box probe (TED-31, `validation/investigations/t2smap-original/mask_probe.py`)
and random testing (TED-46), described in the summary by behaviour; their mechanisms, read in tedana 26.0.3's source
by the replica-side relays (the restricted findings [tedana-t2smap.md](tedana-t2smap.md), "Defects"): TED-31:
`fit_loglinear`'s step for the voxels of one good echo indexes column 0 of an array without columns when no voxel
is left. TED-46: `fit_loglinear` solves each adaptive-mask group with one `numpy.linalg.lstsq` (TED-09's batch),
whose solution leaves rounding noise in the slope of a column of equal observations (spec writer 2: 2,587 such
voxels of the first trial, 1,881 negative and 706 positive, |β1| 5e-19 to 1e-16 per ms); the curve fit
(`fit_monoexponential`) starts from it. Measured: `validation/investigations/t2smap-spec/ted46_curvefit.py` (23
cases). Cases: `validation/investigations/t2smap/replica/check_failures.py` (TED-31 and TED-46, three each), the
golden cases `ted31` and `ted46.*` (`crates-gpl/larmorx-gpl-cli/tests/golden.rs`), the clean-room original's
`tests/run.rs` (`no_voxel_left_for_the_fit_is_ted31`, `equal_observations_take_the_slope_zero`,
`equal_samples_take_the_curve_fits_exact_solution`), its suite's `x-ted46-*` cases and its golden case
`tedana.t2smap.cleanroom.ted46`.'''

