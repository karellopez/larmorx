new = "| Completed | Step |\n|---|---|\n| 2026-11-13 | **Confounds: fMRIPrep's confound estimation.** The confounds fMRIPrep computes for every BOLD run (its `desc-confounds_timeseries.tsv` and the JSON beside it: CompCor, DVARS, framewise displacement, the motion parameters and their expansion, the tissue signals, the spike and cosine regressors), ported bit for bit from fMRIPrep 25.2.7, nipype 1.12.0 and niworkflows 1.15.4 (fMRIPrep 25.2.6's own releases on request) with the arithmetic of the libraries under them: numpy's and SciPy's linear algebra (OpenBLAS's kernels and LAPACK's SVD and least-squares paths, in Rust), SciPy's FFTs, pandas' tables, nitime and nipy. fMRIPrep's own confounds files of 36 runs (21 reference runs) reproduced column by column, their JSON byte for byte; every case of the five records bit-identical (88), in numpy 2.5.4, 2.3.5 and fMRIPrep's 2.2.6; 49 defects of the originals found, 41 corrected or refused by default with the originals' behaviour on request (among them every confounds JSON's missing tissue-signal entries and nipype's file names with a blank); nipype's own command line as `larmorx nipype run`; the Python nodes 1.1 to 1.4 times fMRIPrep's speed at one thread, at most 0.96 of its memory. Its page comes with the documentation's new layout. |\n"

