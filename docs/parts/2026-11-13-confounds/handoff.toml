`lx.niworkflows.parse_formula`, `expand_model` | a term's operators are read with regular expressions over the whole term: text around a group other than a derivative before it and an exponent after it is ignored (`foo(a)`, `(a)b` and `d1x(a)` give `a`'s columns), an exponent after a group that holds another single-caret exponent fails with `TypeError` (`((a)^2)^3`), and a name that starts like a derivative or ends like an exponent (`d1a`, `a^2`) is taken for an operator without its group (`TypeError`) | rule B for ignored text (a `ValueError`), rule A for the rest |\n| PIPE-66 | niworkflows `parse_formula`, `ExpandModel` | `lx.niworkflows.parse_formula`, `expand_model` | a variable reached by two terms of the formula (`a + (a)^^2`) is repeated: twice in `parse_formula`'s table and four times in `ExpandModel`'s file (pandas selects every column of a repeated name each time it is named), and a group that repeats one fails with pandas' `ValueError` (`Shape of passed values ...`) | rule A: each name once |\n| PIPE-67 | niworkflows `spike_regressors` | `lx.niworkflows.spike_regressors`, `spike_regressors_node` | each lag is added to the volumes the earlier lags flagged, so lags `[1, 2]` (or `[0, 1, 2]`) flag the third volume after a spike too | rule A: each lag added to the flagged volumes only |\n| PIPE-68 | niworkflows `spike_regressors` | `lx.niworkflows.spike_regressors`, `spike_regressors_node` | `minimum_contiguous` counts the last run of unflagged volumes one volume longer than it is (its end is taken one past the table), so a final run one volume shorter than the minimum is not flagged | rule A: the last run's true length |\n| PIPE-69 | niworkflows `spike_regressors` | `lx.niworkflows.spike_regressors` | a criterion other than `'<'` and `'>'` is skipped without an error (when every criterion is: `TypeError: reduce() of empty iterable with no initial value`) | rule B: a `ValueError` |\n| PIPE-70 | niworkflows `NormalizeMotionParams` | `lx.niworkflows.normalize_motion_params` | numpy's `loadtxt` squeezes a table of one row to a vector, which numpy's `apply_along_axis` refuses (`AxisError: axis 1 is out of bounds for array of dimension 1`) | rule A: the row kept |\n| PIPE-71 | nitransforms `linear.load` (fMRIPrep `FSLMotionParams`, `FSLRMSDeviation`) | `lx.confounds.fsl_motion_params`, `fsl_rms_deviation`; `lx.niworkflows.fsl_motion_params`, `fsl_rms_deviation` | a transform file of one transform is loaded as one `Affine`, whose 4 × 4 matrix fMRIPrep's `FSLMotionParams` and `FSLRMSDeviation` then take as a series of four (its rows): a one-volume series stops with numpy's `AxisError` | rule A: a series of one |\n| PIPE-72 | fMRIPrep `FSLMotionParams` | `lx.confounds.fsl_motion_params` | a reference image whose centre of gravity is undefined (under 25.2.7 a constant image, whose weights `value - min` are all zero; under 25.2.6 a sum of zero; in either a NaN or infinite voxel) gives NaN or infinite translations in every row without an error, which `FramewiseDisplacement` turns into `n/a` everywhere | rule B: a `ValueError` |\n| PIPE-73 | nitransforms `ITKLinearTransform` | `lx.confounds.fsl_motion_params`, `fsl_rms_deviation` | every ITK text transform is read in single precision (numpy's `genfromtxt` with `dtype=\"f4\"`), the double-precision ones (`AffineTransform_double_3_3`) too, so their parameters are rounded to float32 | rule A: `_double_` transforms in float64 |\n| PIPE-74 | fMRIPrep `_binary_union` | `lx.confounds.binary_union` | the masks are cast to int64 with numpy's cast, undefined in C for NaN, infinities and values beyond int64's range: on x86-64 they become the most negative int64, so a voxel of +inf or 1e19 (or a uint64 value from 2^63) is outside the union | clamped (D13's rule for undefined conversions) |\n| PIPE-75 | fMRIPrep `_binary_union` | `lx.confounds.binary_union` | masks of different shapes are broadcast without an error (a mask of shape `(X, Y, 1)` is taken for every slice of an `(X, Y, Z)` one) | rule B: a `ValueError` |\n| PIPE-76 | fMRIPrep `acompcor_masks` | `lx.confounds.acompcor_masks`, `acompcor_masks_node` | with `is_aseg` the grey-matter map is cast to uint8 with numpy's cast before the test `> 0`: integers wrap (-1 is 255, inside; 256 is 0, outside), and floats out of int32's range or NaN are undefined in C (on x86-64 0, outside; a float in range keeps its truncated int32's low byte: 300.0 is 44) | clamped to [0, 255] first (D13's rule; rule A for the wrap) |\n| PIPE-77 | niworkflows `BinaryDilation` | `lx.niworkflows.binary_dilation`, `image_binary_dilation` | a negative radius (`traits.Int` takes it) dilates with scikit-image's ball of that radius, an arbitrary footprint: -1 is one false element, so the dilated mask is empty; -2 the cross of radius 1 | rule B: a `ValueError` |\n| PIPE-78 | niworkflows `SignalExtraction` | `lx.niworkflows.signal_extraction` | a class label holding a tab or a line break is written as it is, which breaks the table's columns or rows | rule B: a `ValueError` |\n| PIPE-80 | nipype `CommandLine` (ANTs, FSL, AFNI interfaces) | `larmorx._nipype` (every program larmorx runs through nipype's command lines: larmorprepx's confounds and field-map stages, `lx.sdcflows`, `lx.niworkflows`) | some file names are written into the command line unquoted (the files inside ANTs' bracketed arguments: `ApplyTransforms`' `--transform [ f, 1 ]` and `--output`, `Registration`'s `--metric`, `--masks`, `--initial-moving-transform` and `--output`, `N4BiasFieldCorrection`'s and `DenoiseImage`'s `[ out, extra ]`; `ApplyTransforms`' `--transform f`, `MultiImageMaths`' operands, `TOPUP`'s `--datain` file), and the line runs through the shell, so a file name with a blank is split into several words (one with a quote breaks the line); `BET` makes its input's name relative after quoting it: the program gets other file names and fails | rule A: the file names quoted |\n| PIPE-81 | nipype `nipypecli run` | `larmorx nipype run`, `lx.nipype.run` | `nipypecli run` gives an input of a compound trait (`traits.Either`) the argparse type of the input before it in name order, a variable left from the loop's previous iteration (CompCor's `num_components` reads text, so a number of components is refused; `save_pre_filter` and `save_metadata` read a float, so a file name or `True` is refused), and cannot build the parser of an interface whose first input is compound (`UnboundLocalError`: niworkflows' `TSV2JSON`) or that has a list of compound items (`AttributeError`: niworkflows' `DictMerge`, fMRIPrep's `FMRISummary`) | rule A: a compound input read by its trait |\n| PIPE-82 | nipype `nipypecli run` | `larmorx nipype run`, `lx.nipype.run` | `nipypecli run` reads an input's text by the type of its default value, not by its trait: a float input whose default is an integer reads only integers (CompCor's `high_pass_cutoff`, so fMRIPrep's own `128.0` is refused; `FramewiseDisplacement`'s `radius`), and the texts of a tuple (`aCompCorMasks`' `bold_zooms`, `RegridToZooms`' `zooms`, the plots' `figsize`), an optional dictionary or an enumeration's values that are not text (CompCor's `pre_filter False`, `GenerateSamplingReference`'s `xform_code`) reach the trait unconverted and are refused whatever is given; a list of booleans reads every text but the empty one as true | rule A: each text read by its trait |"

