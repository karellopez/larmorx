text = "| NP-09 | numpy 2.5.4 (OpenBLAS 0.3.34's Haswell kernels on AMD Zen 4/5) | OpenBLAS from 0.3.31 sets the products' depth block (`GEMM_Q`) to 512 for every core's table on AMD CPUs with an L2 of 1 MiB, an L3 a multiple of 32 MiB and AVX-512; with it the Haswell kernel's 12-column paths overflow their stack buffer on depth blocks above 298 steps: `a @ b` with about 25 rows or more and an inner dimension of 384 to 512, 700, 768, 1,024, ... crashes (SIGSEGV) or hangs, and so do LAPACK's blocked QR, LQ, bidiagonal and divide-and-conquer paths (numpy's `svd` and `qr` at CompCor's sizes); the results of that class that do not crash follow memory numpy never wrote (they change from run to run: 83 to 96 of 92 to 96 identical in four runs) | a | none (fMRIPrep's image runs numpy 2.2.6 on OpenBLAS 0.3.30, without the block); a user of numpy 2.5.4 with `OPENBLAS_CORETYPE=Haswell` on such a CPU | never reproduced (a crash): larmorx's depth block is 256, a real Haswell's and every oracle's (`gemm_q=512` exists for validation only); the confounds' numpy 2.5.4 checks and records run with `OPENBLAS_L2_SIZE=512`, which keeps 256; the suites report the class's tallies as values (the confounds' part, 2026-11-11) | – |\n| NP-10 | numpy 2.3.5 and 2.2.6 `svd`, `pinv`, `lstsq` | numpy's `svd` (so `pinv`, nipype's `fallback_svd` and SciPy's `Rotation.from_matrix`) and `lstsq` hand a matrix holding ±inf to LAPACK, whose scaling turns it into NaN: of 28 `svd` probe cases 7 hang (an infinite loop), 9 return infinite or NaN values without an error (most after three `DLASCL` \"parameter number 5 had an illegal value\" messages), 12 raise `LinAlgError`; of 40 `lstsq` cases 6 hang and 34 raise; numpy 2.5.4 raises `LinAlgError` on all 68 (numpy issue 32591) | a | none (fMRIPrep's series are finite, and CompCor zeroes non-finite voxels first) | rule B: numpy 2.5.4's `LinAlgError` for every release in both modes; the hang never reproduced, nor the garbage results (the same undefined input class) (the confounds' part, 2026-11-11) | – (never reproduced) |"

