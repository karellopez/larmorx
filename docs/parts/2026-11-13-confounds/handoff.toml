text = "| PIPE-41 | fMRIPrep `init_bold_confs_wf` | `larmorx.pipelines.larmorprepx.confounds.bold_confounds` | `merge_confound_metadata`'s third input is set to the tissue signals' metadata (`{\"Method\": \"Mean\"}` for `global_signal`, `csf`, `white_matter`, `csf_wm` and `tcompcor`) and then connected to the crown's metadata, which replaces it: the confounds' JSON never describes those five columns | rule A: the tissue signals' metadata kept beside the crown's |\n| PIPE-43 | niworkflows `parse_formula` (`ExpandModel`) | `lx.niworkflows.parse_formula`, `expand_model` | the variables of each group of a model formula, and the columns `others` stands for, are ordered as a Python `set` of strings, whose order follows the process's hash seed: `ExpandModel` writes a variable's expansion columns in another order from one run to the next (`x_power2` before `x_derivative1_power2` in 169 groups of the 36 oracle files, after it in 155); the values do not depend on it | the first occurrence's order in both modes (never reproduced), with a notice where another set order would change the result |\n| PIPE-44 | nipype `compute_noise_components` | `lx.confounds.compute_noise_components`, `compcor`, `acompcor`, `tcompcor`; `lx.niworkflows.robust_acompcor`, `robust_tcompcor` | a mask that gives no component (an empty mask with `components_criterion='all'`) ends the loop over the masks (`break`): the masks after it are skipped, their components and metadata lost, and when no component was found `failure_mode='NaN'` stops with `ValueError: need at least one array to concatenate` instead of returning | rule A: the loop goes on with the next mask |\n| PIPE-45 | nipype `compute_noise_components` | `lx.confounds.compute_noise_components`, `compcor`, `acompcor`, `tcompcor`; `lx.niworkflows.robust_acompcor`, `robust_tcompcor` | only the voxels whose float sum over time is NaN are zeroed: a voxel holding an infinity (and no NaN) reaches the pre-filter and the SVD, which then fails (every component of the mask NaN with `failure_mode='NaN'`, or `ValueError: array must not contain infs or NaNs`), while a finite voxel whose float32 sum overflows both ways is zeroed | rule A: exactly the voxels holding a non-finite value are zeroed |\n| PIPE-46 | nipype `compute_dvars` | `lx.confounds.compute_dvars`, `compute_dvars_node` | the voxel-wise standardisation, which runs whatever DVARS the caller asked for, turns numpy's floating-point warnings into errors: a voxel whose predicted difference SD is 0 (every series of two volumes; a robust SD of 0 kept by `remove_zerovariance=False`; an AR(1) estimate of exactly 1) stops the whole computation with `RuntimeWarning: divide by zero encountered in divide` (or `invalid value`), and every DVARS series is lost | rule A: the voxels whose predicted SD is 0 left out of the voxel-wise mean |\n| PIPE-47 | nipype `compute_dvars` | `lx.confounds.compute_dvars`, `compute_dvars_node` | an AR(1) estimate above 1, which the float32 FFT's rounding gives for a series whose lag-1 autocorrelation is just below 1 (the exact Yule-Walker estimate of the biased autocorrelation is below 1), makes the predicted difference SD the square root of a negative number: every standardised and voxel-wise DVARS value is NaN, without an error | rule A (measured first): the AR(1) estimate clamped at 1 |\n| PIPE-50 | nipype `compute_dvars` | `lx.confounds.compute_dvars`, `compute_dvars_node` | a voxel whose demeaned series is all zeros (an all-zero voxel, or a constant one whose `regress_poly(0)` residual rounds to exactly 0, kept by `remove_zerovariance=False`, nipype's function default) has the Yule-Walker equation `0 · a = 0`: with SciPy 1.15 nitime's solve returns NaN, which makes every standardised and voxel-wise DVARS value NaN without an error; with SciPy 1.18 it stops with `LinAlgError: A singular matrix detected.` | rule A: the minimum-norm solution 0, then PIPE-46's exclusion |\n| PIPE-51 | nipype `TSNR` | `lx.confounds.tsnr` | the maps of a series stored as integers (tSNR, mean, standard deviation, the detrended series) are written in that integer type, quantized by nibabel's scaling (256 levels for uint8, 65,536 for int16): the check meant to switch the header to float32 for integer data never fires, as the data are float32 by then | rule A: the maps written as float32 |\n| PIPE-52 | nipype `regress_poly` | `lx.confounds.regress_poly`, `compcor`, `acompcor`, `tcompcor` | the non-constant regressors it returns (CompCor's Legendre pre-filter file) are `X[:, :-1]`, the constant and every polynomial but the highest, not the polynomials of degree 1 to `d` | rule A: the polynomials of degree 1 to `d` |\n| PIPE-53 | nipype `regress_poly`, `cosine_filter` | `lx.confounds.regress_poly`, `cosine_filter` | an `axis` other than the last takes that axis' length as the series' length but reshapes the data in memory order to rows of that length, so the series regressed are runs of consecutive values across voxels and volumes, without an error | rule B: a `ValueError` |\n| PIPE-54 | nipype `compute_noise_components` | `lx.confounds.compute_noise_components`, `compcor`, `acompcor`, `tcompcor`; `lx.niworkflows.robust_acompcor`, `robust_tcompcor` | a `components_criterion` of 0 ends the loop over the masks at the first one, and a negative one other than -1 (`'all'`) slices columns off the end of each mask's components (`u[:, :-2]`) while marking none retained in the metadata; a count given as a float (6.0) stops with `TypeError` when an SVD fails with `failure_mode='NaN'` | rule B: 0 and negative criteria other than -1 refused; rule A: a float count by its integer part |\n| PIPE-55 | nipype `compute_noise_components` | `lx.confounds.compute_noise_components`, `compcor`, `acompcor`, `tcompcor`; `lx.niworkflows.robust_acompcor`, `robust_tcompcor` | an empty mask with a `failure_mode` other than `'error'` returns an empty pre-filter basis, so when it is the last mask the cosine or polynomial basis is lost (CompCor's pre-filter file then holds no basis column) | rule A: the basis kept |\n| PIPE-56 | nipype `CompCor` | `lx.confounds.compcor`, `acompcor`, `tcompcor` | the repetition time read from the header is converted from milliseconds but not from microseconds (`xyzt_units` usec): it is taken as that many seconds, which gives a cosine basis of millions of columns | rule A: microseconds converted |\n| PIPE-57 | nipype `compute_noise_components` | `lx.confounds.compute_noise_components`, `compcor`, `acompcor`, `tcompcor`; `lx.niworkflows.robust_acompcor`, `robust_tcompcor` | a `filter_type` other than `'cosine'`, `'polynomial'` and `False` silently filters nothing, not even the mean, and a float32 series is then decomposed in single precision | rule B: a `ValueError` (`reproduce` of a float32 series refused: `sgesdd` not ported) |\n| PIPE-58 | nipype `compute_noise_components` | `lx.confounds.compute_noise_components`, `compcor`, `acompcor`, `tcompcor`; `lx.niworkflows.robust_acompcor`, `robust_tcompcor` | `mask_names` shorter than the masks silently drops the masks without a name (`zip`): their components and metadata are not computed | rule B: a `ValueError` |\n| PIPE-59 | nipype `compute_noise_components` | `lx.confounds.compute_noise_components`, `compcor`, `acompcor`, `tcompcor`; `lx.niworkflows.robust_acompcor`, `robust_tcompcor` | an SVD that fails with `failure_mode='NaN'` is replaced by `T` NaN singular values whatever the decomposition's size `min(T, N)`, and with `components_criterion='all'` by one NaN component while all `T` values are marked retained (CompCor's metadata then names every one after the first component) | rule A: `min(T, N)` NaN values |\n| PIPE-60 | nipy `rotation_vec2mat` (nipype `normalize_mc_params(..., 'NIPY')`) | `lx.confounds.normalize_mc_params`, `framewise_displacement` (`parameter_source=\"NIPY\"`) | the angle of a rotation vector given as integers is the square root of its sum of squares computed in the vector's own type, which wraps around silently (a