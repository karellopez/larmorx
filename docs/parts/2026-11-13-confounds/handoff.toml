[[op]]
do = "insert"
file = "validation/tools.toml"
after = "validation = \"original: [{tedana-t2smap-original.pass}"
text = "\n[[tool]]\nid = \"confounds\"\ntitle = \"fMRIPrep's confound estimation (CompCor, DVARS, framewise displacement, the motion parameters and RMS deviation, the masks and tissue signals, the confounds table and its JSON; nipype's confounds module and `nipypecli run`; numpy's and SciPy's linear algebra and FFTs under them)\"\neco = \"larmorx\"\nuse = [\"larmorx nipype run\", \"lx.confounds\", \"lx.niworkflows\", \"lx.nipype.run\", \"larmorx.pipelines.larmorprepx.confounds.bold_confounds\"]\nhow = \"port (fMRIPrep 25.2.7's confounds workflow and interfaces, with 25.2.6's for the step; nipype 1.12.0's `algorithms/confounds.py` and command line; niworkflows 1.15.4's confound interfaces; nitime 0.12.1, nipy 0.6.1, pandas 3.0.6 and 2.2.3; numpy 2.5.4, 2.3.5 and 2.2.6's and SciPy 1.18.1 and 1.15's linear algebra (OpenBLAS's level 1 to 3 kernels, LAPACK 3.12.1's and 3.12.0's SVD and least-squares paths) and single-precision FFTs, in Rust)\"\nvalidation = \"[{confounds-linalg.cases}](record:confounds-linalg) and [{confounds-linalg-full.cases}](record:confounds-linalg-full) cases of numpy's and SciPy's linear algebra, [{confounds-nipype.cases}](record:confounds-nipype) and [{confounds-nipype-full.cases}](record:confounds-nipype-full) of nipype's confounds module and command line, [{confounds-fmriprep.cases}](record:confounds-fmriprep) of fMRIPrep's and niworkflows' steps and the workflow, every one bit-identical to the originals (every array, file, table cell, header, warning, message and exit status) in numpy 2.5.4, 2.3.5 and fMRIPrep 25.2.6's 2.2.6: fMRIPrep's 36 confounds files of 21 oracle runs column by column and their JSON byte for byte, from LARMORX's workflow run as fMRIPrep ran it; PIPE-41 to PIPE-83, PD-01 to PD-03, NP-09, NP-10 and SCI-41: 29 corrected by default (two undefined conversions clamped) and 12 refused, 41 with `reproduce`; the 26 Python nodes [1.1 to 1.4 times as fast](repo:docs/benchmarks/confounds.md) as fMRIPrep's at one thread and 1.5 to 1.6 at eight on three oracle runs (numpy's SVD and least squares, ported, still slower: a speed item), at most 0.96 of the originals' peak memory\"\n"

[[op]]
do = "insert"
file = "validation/tools.toml"
after = "status = \"`experimental` ({tedana-t2smap-replica.pass}"
text = "\n[[record]]\nid = \"confounds-linalg\"\nlarmorx = \"`larmorx_transform::openblas` (OpenBLAS's level 1 to 3 routines) and `numpy_linalg` (LAPACK's QR, LQ, bidiagonal, divide-and-conquer and `DGESVD` paths; numpy's `svd`, `pinv` and `lstsq`; SciPy's `gesvd` and nipype's `fallback_svd`), `larmorx_core::numpy`'s reductions, CORE-MATH's `hypot` (through `_core`'s validation bindings)\"\nreference = \"numpy 2.3.5 (OpenBLAS 0.3.30, LAPACK 3.12.0), numpy 2.5.4 (OpenBLAS 0.3.34.106, LAPACK 3.12.1; `OPENBLAS_L2_SIZE=512`, and at the machine's depth block of 512 for the undefined class, NP-09) and fMRIPrep 25.2.6's numpy 2.2.6, and SciPy 1.18.1's and 1.15.3's own OpenBLAS (0.3.31-22, 0.3.28), in-process on OpenBLAS's Haswell kernels at one thread; the other release told apart in every negative control\"\nstatus = \"`experimental` ({confounds-linalg.pass} of {confounds-linalg.compared} cases bit-identical, the routines' illegal arguments and refusals included)\"\n\n[[record]]\nid = \"confounds-linalg-full\"\nlarmorx = \"the same, the full tiers: every routine up to CompCor's largest real shapes (280 × 60,968, 597 × 30,453), both LAPACK releases\"\nreference = \"the same environments, the full tiers of `check_svd.py`, `check_gesdd.py`, `check_gelsd.py` and `check_gesvd.py` (after the `DBDSQR` tolerance's correction)\"\nstatus = \"`experimental` ({confounds-linalg-full.pass} of {confounds-linalg-full.compared} cases bit-identical; in numpy 2.5.4 at the machine's depth block of 512 every defined case identical and every crash in NP-09's class)\"\n\n[[record]]\nid = \"confounds-nipype\"\nlarmorx = \"`lx.confounds` (nipype's CompCor, DVARS with nitime's AR(1) and SciPy's FFTs, TSNR, `NonSteadyStateDetector`, `FramewiseDisplacement` with nipy's `NIPY` source), niworkflows' robust CompCor wrappers, `larmorx nipype run` (`lx.nipype.run`)\"\nreference = \"nipype 1.12.0, nitime 0.12.1, nipy 0.6.1 and niworkflows in-process in the newest and the shared releases and in fMRIPrep 25