[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "larmorx"
description = "Neuroimaging tools in Rust (ANTs/ITK, AFNI and FreeSurfer ports; clean-room FSL- and Workbench-like tools) with Python wrappers and compatible CLIs"
readme = "README.md"
requires-python = ">=3.12"
# The AFNI replicas carry CC BY 4.0's attribution for the Medical College of Wisconsin's code,
# and Arm's MIT notice for sinf/cosf (NOTICE; their texts in LICENSES/).
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
keywords = ["neuroimaging", "mri", "fmri", "registration", "preprocessing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dynamic = ["version"]
# ITK's .h5 transform files are read and written in Rust (crate larmorx-hdf5): no h5py.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Pipeline-only dependencies (PLAN.md §2.2); library users do not need them.
prep = ["templateflow", "matplotlib", "nilearn", "pandas", "jinja2"]
# Everything (the user's decision of 2026-10-16): the pipeline's dependencies and every replica
# package, the FSL replicas (crates-nc/, FSL Licence: non-commercial) included; larmorx-freesurfer
# joins when it exists, and larmorx-gpl with Connectome Workbench's replicas. Not on PyPI yet:
# build them with `maturin build --release`. The AFNI replicas are part of larmorx itself since
# 2026-10-29 (the `exact` extra, which installed them as larmorx-gpl, is gone with it).
all = ["larmorx[prep]", "larmorx-nc"]

[project.scripts]
larmorx = "larmorx.cli:main"
lx = "larmorx.cli:main"
larmorprepx = "larmorx.pipelines.larmorprepx.cli:main"

[project.urls]
Repository = "https://github.com/karellopez/larmorx"
Issues = "https://github.com/karellopez/larmorx/issues"

[dependency-groups]
test = ["pytest>=8", "packaging", "nibabel>=5.3"]
lint = ["ruff==0.16.10"]
dev = ["maturin>=1.15,<2", { include-group = "test" }, { include-group = "lint" }]

[tool.maturin]
manifest-path = "crates/larmorx-py/Cargo.toml"
python-source = "python"
module-name = "larmorx._core"

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/golden", "tests/parity"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests/python"]
# Python code blocks in the docs are illustrative; do not reformat them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Line length is enforced by the formatter; it leaves long string literals alone.
ignore = ["E501"]
# Typographic characters used on purpose in report text.
allowed-confusables = ["×", "–", "−"]
