[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "larmorx"
description = "Neuroimaging tools reimplemented in Rust, with Python bindings and the original programs' command lines: ANTs/ITK, AFNI, sdcflows and clean-room FSL-compatible tools"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Karel Mauricio López Vilaret", email = "karel.mauricio.lopez.vilaret@uni-oldenburg.de" },
]
# larmorx's own licence is Apache-2.0 (LICENSE). The expression names every licence of the code
# the wheel holds: the works NOTICE names (VXL, Eigen, CORE-MATH, SciPy, numpy, CPython, HDF5,
# AFNI's MCW code under CC BY 4.0, fdlibm, ...; their texts and notices in NOTICE and LICENSES/)
# and the Rust crates it is built with (zlib-rs, libbz2-rs-sys; the wheel's SBOM lists them all).
# scripts/release/licences.py derives it and checks it (validation/tests/test_release.py).
license = "Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND bzip2-1.0.6 AND CC-BY-4.0 AND HDF5 AND LicenseRef-CTN AND LicenseRef-MNI AND MIT AND MPL-2.0 AND PSF-2.0 AND SunPro AND Zlib"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
keywords = ["neuroimaging", "mri", "fmri", "registration", "preprocessing", "ants", "afni", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dynamic = ["version"]
# ITK's .h5 transform files are read and written in Rust (crate larmorx-hdf5): no h5py.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# What the larmorprepx pipeline needs (PLAN.md §2.2; a preview in 0.1: only its field-map stages
# exist); library users do not need them.
prep = ["templateflow", "matplotlib", "nilearn", "pandas", "jinja2"]
# Everything (the user's decision of 2026-10-16): the pipeline's dependencies and every replica
# package, the FSL replicas (larmorx-nc, crates-nc/: the FSL Licence, non-commercial use only) and
# the GPL family's (larmorx-gpl, crates-gpl/: the GNU GPL version 3, tedana's t2smap since
# 2026-11-08); larmorx-freesurfer joins when it exists. Pinned to this release: the three packages
# have one version (scripts/release/set_version.py). The AFNI replicas are part of larmorx itself
# since 2026-10-29.
all = ["larmorx[prep]", "larmorx-nc==0.1.0rc1", "larmorx-gpl==0.1.0rc1"]

[project.scripts]
larmorx = "larmorx.cli:main"
lx = "larmorx.cli:main"
larmorprepx = "larmorx.pipelines.larmorprepx.cli:main"

[project.urls]
Homepage = "https://karellopez.github.io/larmorx_documentation/"
Documentation = "https://karellopez.github.io/larmorx_documentation/"
Repository = "https://github.com/karellopez/larmorx"
Issues = "https://github.com/karellopez/larmorx/issues"
Changelog = "https://github.com/karellopez/larmorx/blob/main/CHANGELOG.md"

[dependency-groups]
test = ["pytest>=8", "packaging", "nibabel>=5.3"]
lint = ["ruff==0.16.10"]
dev = ["maturin>=1.15,<2", { include-group = "test" }, { include-group = "lint" }]

[tool.maturin]
manifest-path = "crates/larmorx-py/Cargo.toml"
python-source = "python"
module-name = "larmorx._core"

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/golden", "tests/parity"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests/python"]
# Python code blocks in the docs are illustrative; do not reformat them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Line length is enforced by the formatter; it leaves long string literals alone.
ignore = ["E501"]
# Typographic characters used on purpose in report text.
allowed-confusables = ["×", "–", "−"]
