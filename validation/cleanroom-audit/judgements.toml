# SPDX-License-Identifier: Apache-2.0
# The human judgement of every item the clean-room audit raised (python -m larmorx_validation
# cleanroom-audit verdicts; docs/validation/clean-room-audit.md). Written by the audit's relay 2
# (2026-11-06) after reading each call and its output in the transcripts; extended at each merge
# by the orchestrator when `cleanroom-audit gate` lists a new item (scripts/orchestration/
# cleanroom-audit-merge.sh). The public summary takes its words from here; the gate stops a merge
# on any blocking item that has no entry here.
#
# [[access]]: one tool call of a clean-room implementer that showed restricted material (a slip):
#   agent (the harness's agent id), line (the call's record line in that agent's transcript),
#   time (UTC), declared ("yes": in the part's report or notes; "partly": declared, under-counted;
#   "covered": the same exposure as a declared call; "no"), shown (what the output showed, in
#   words), nature (what that material is), judgement.
# [[edit]]: an edit of clean-room code by an agent of another role (the orchestrator, an
#   integration agent, a replica author): agent ("orchestrator" for the orchestrator), commit (the
#   short hash; "" for an edit never committed), what, judgement.
# [verdict]: each clean-room original's verdict in words (tool id: family/tool).
# [[limit]]: what the evidence cannot see. [[recommendation]]: what the audit recommends.

