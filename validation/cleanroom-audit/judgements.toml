"AFNI/tshift" = "clean: no agent with access to AFNI's source or the replica's code wrote its algorithms; one declared exposure (AFNI-26: 9 lines of the GPL replica and 2 of the register, all restating behaviour the spec gave) and the integration agent's 9 lines of plumbing"
