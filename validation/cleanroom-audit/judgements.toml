# ------------------------------------------------- what the evidence cannot see

[[limit]]
title = "Programs' own reads"
text = "A command's reads are seen through the paths it names and the output it printed: cargo, pytest and scripts read files the transcript does not list. A compile error in a replica crate or a failing replica test would print source lines: none was found in the implementers' outputs (the compiler's diagnostics are parsed), but outputs written to log files and never shown are not in the transcripts (some relays ran their gates that way)."

[[limit]]
title = "Listings"
text = "The names printed by `find` and `ls` are not parsed (the search tools' are): names-level slips of that kind are seen only through the command's arguments, and they are names only, by definition."

[[limit]]
title = "Replica suites the briefs allowed"
text = "The FLIRT, FAST, topup and fslmaths clean-room briefs named the replica's parity suite for its cases and mechanics. Their implementers' reads of it are allowed by their briefs; the suites were written by replica authors and are not judged line by line."

[[limit]]
title = "Roles"
text = "Roles are read from the launch descriptions and the briefs; four were settled by hand. Every agent that touched clean-room code was checked by reading its brief's role sentence."

[[limit]]
title = "Searches of one file"
text = "A search of a single file prints no file name: the register's are checked by content against every version of its restricted lines, every other restricted file's against that file's lines today (a line that changed since would not be recognised)."

[[limit]]
title = "Before the first record"
text = "The repository's first 15 minutes (its root commit, 2026-10-09) precede the first transcript record; no clean-room code existed then. Agents without a harness worktree in their metadata (early agents and relays) are attributed by the commit hashes they printed or by their commit commands."

[[limit]]
title = "The briefs"
text = "The briefs were written by the orchestrator, who reads source to merge: the clean-room parts' briefs hold no line of a restricted register section and no line of a source-derived finding (checked against every version), and name upstream source files only in their forbidden lists."

[[limit]]
title = "Live transcripts"
text = "Transcripts newer than the archive of 2026-11-05 were read where Claude Code keeps them; they still grow and are deleted after 30 days. From this audit on, every merge copies its part's transcripts into the archive with their SHA-256 before it runs the audit."

# ------------------------------------------------- recommendations

[[recommendation]]
text = "Name the replica program as an allowed black box in the porting guide (every FSL clean-room part runs it), and say which replica suite modules a clean-room brief may name."

[[recommendation]]
text = "Since the AFNI replicas moved into crates/ (2026-10-29), a search over crates/ prints their lines: briefs should ask for `grep ... crates/ --exclude-dir=larmorx-afni-replica` (two undeclared slips of this kind)."

[[recommendation]]
text = "Exclude folders with `--exclude-dir` rather than by filtering a search's output: a filter on `^./` fails when grep prints names without `./` (the AFNI-26 slip)."

[[recommendation]]
text = "Run the audit at every merge (scripts/orchestration/cleanroom-audit-merge.sh): it archives the part's transcripts and stops the merge on any unjudged edit of clean-room code after restricted material of the tool's family."

