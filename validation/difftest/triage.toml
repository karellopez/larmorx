# --- The clean-room catch-up's random-testing trials (relay 8, 2026-11-05): the clean-room originals
# of topup, FAST, FLIRT, BET and the head-motion correction, each boxed, 30 minutes, the oracle cache
# in use mode (oracles/difftest/2026-11-05-catchup-<tool>/); every difference judged by the user's
# rule; probes in validation/investigations/cleanroom-topup/trial_*.py, cleanroom-flirt/catchup8_int_nn.py

[[difference]]
tool = "fsl-topup-original"
implementation = "original"
signature = ["corrected: relative difference inside the brain, Nth percentile", "corrected_mean: relative difference inside the brain, Nth percentile"]
status = "explained"
explanation = "Trial 2026-11-05-catchup-topup (seed topup-trial, 17,535 cases: 13,300 agree, 4,223 differ, 12 notices; of the 6,999 differences of the 2026-11-03 trial's cases drawn again 3,695 now agree). 3,213 differences estimate the movements and lie within 10 times FSL's own band (its run with the read-out times changed in their last float bit; the failed metric's median 2.2 times that band): FSL-201's forward differences make FSL's path depend on its inputs' last bits, which the original's reproduce mode follows to its first gradients but not along a chaotic path (FSL's runs with 16 and 256 last bits changed lie as far as the original on 2 of 5 sampled findings, within 1.3 to 5 times on the other 3; trial_spread.py, trial_categories.py)"
link = "docs/findings/fsl-topup-original.md"
defect = "FSL-201"

[[difference]]
tool = "fsl-topup-original"
implementation = "original"
signature = ["o_movpar.txt: rotations"]
status = "open"
explanation = "Trial 2026-11-05-catchup-topup: 608 differences with the movements estimated lie beyond 10 times FSL's one-bit band. Of 14 sampled, 6 lie within FSL's own spread at 16 and 256 last bits (trial_spread.py). 179 findings run away (the original's movements end tens of mm and rad from FSL's; 159 with a scaled-conjugate-gradient level, which FSL warns against; 98 already in the 2026-11-03 trial; in both modes). Measured on topup-trial-04946 with --debug (trial_fsl_verbose.py, trial_modes.py): the first gradients agree to 1e-7 (a rotation entry 424.197644 against 424.197704) and the field part of the second, at x + sigma d, to 9e-5, but its rotation entries part by 1.5 % (2269.50 against 2302.73): FSL-201's forward differences of single-precision rotation matrices jump by about 2 % when an angle's single-precision rounding flips, and the scaled conjugate gradients divide that difference by their small sigma, so the curvature and the step are different numbers from the first iteration on (FSL's own end is a rotation of 0.69 rad). Open where FSL-201's path cannot explain it; the runaway class explained by FSL-201 with SCG"
link = "docs/findings/fsl-topup-original.md"

[[difference]]
tool = "fsl-topup-original"
implementation = "original"
signature = ["_fieldcoef (its field, Hz): correlation inside the brain", "_fieldcoef (its field, Hz): |d| inside the brain, Nth percentile", "_fieldcoef (its field, Hz): |d| inside the brain, mean"]
