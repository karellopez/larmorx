# SPDX-License-Identifier: Apache-2.0
# What was done about each difference random testing found (docs/validation/difftest.md,
# "Triage"). The site's "Random testing" panels read it (larmorx_validation.evidence.difftest):
# a night's difference takes the first entry of its tool and implementation that shares one of
# its checks (`signature`, the names of the checks that failed).
#
# status: fixed (larmorx was wrong; fixed, with a unit test and a permanent case), register (a
# defect of the original, in docs/findings/upstream-defects.md, decided by rules A-D), open (a
# clean-room original's difference, reported for its agent with a black-box reproducer),
# harness (the comparison's own mistake, corrected in the harness), unclear (for the
# orchestrator). link: a repository path (a permanent case, a finding) or a site path.

# ---------------------------------------------------------------- fixed in the ports and replicas

[[difference]]
tool = "ants-multiply-images"
implementation = "port"
signature = ["affine", "header (every field)"]
status = "fixed"
explanation = "ITK's NIfTI reader chooses between the sform and the qform with vnl's float SVD; larmorx decided in double, so an image with equal voxel sizes could take the other matrix (`larmorx-io`, `nifti/itk.rs`)"
link = "validation/difftest/cases/ants-multiply-images/sform-qform-equal-voxel-sizes.json"

