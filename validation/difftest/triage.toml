# ---------------------------------------------------------------- defects of the originals

[[difference]]
tool = "ants-resample-image"
implementation = "port"
signature = ["both succeed"]
status = "register"
defect = "ANTS-160"
explanation = "Gaussian interpolation given fewer sigmas than dimensions: ANTs reads the missing ones past the end of its list and exits 0 with a result that depends on the heap; larmorx refuses in both modes (class a, never reproduced)"
link = "validation/difftest/cases/ants-resample-image/gaussian-sigmas-short.json"

[[difference]]
tool = "ants-image-math"
implementation = "port"
signature = ["values (bit-identical)"]
status = "register"
defect = "ITK-95"
explanation = "grayscale opening, closing, dilation or erosion with a radius of 0 on an image whose first axis has one voxel: ITK's moving histogram leaves voxels at ±FLT_MAX; larmorx gives the input (the identity) in both modes, ITK's values are not reproduced"
link = "validation/investigations/difftest/morphology_radius0.py"

# ---------------------------------------------------------------- the clean-room originals

[[difference]]
tool = "afni-tshift"
implementation = "replica"
signature = ["DN defaults: replica = original"]
status = "open"
explanation = "the corrected AFNI-07 header of a sheared sform in metres: the clean-room original's pixdim[3] differs from the replica's in the last bits (1000.6248168945312 against 1000.624755859375); reported for the clean-room agent"
link = "validation/investigations/difftest/inspect_tshift.py"

[[difference]]
tool = "afni-automask"
implementation = "original"
signature = ["mask.nii: header bytes", "masked.nii: header bytes"]
status = "open"
explanation = "a 1 x 1 x 2 constant oblique image: the clean-room original's output header differs from AFNI's in its bytes; reported for the clean-room agent"

[[difference]]
tool = "mri-hmc"
implementation = "original"
signature = ["out_mcf.nii.gz: voxel values", "out_mcf.nii.gz.mat: matrix RMS deviation, Nth percentile", "FD (Power, N mm) correlation", "out_mcf.nii.gz_abs.rms: values", "out_mcf.nii.gz_rel.rms: values", "out_mcf.nii.gz_sigma.nii.gz: voxel values"]
status = "open"
explanation = "small random phantoms of 4 to 8 volumes, beyond the record's thresholds: the clean-room original's motion estimates leave mcflirt's on images where the cost function has several minima; reported for the clean-room agent with the reproducers"

