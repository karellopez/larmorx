[[difference]]
tool = "ants-resample-image-by-spacing"
implementation = "port"
signature = ["both succeed"]
status = "fixed"
explanation = "a spacing that gives an image of no voxel: ITK's ImageFileWriter refuses to write it (ANTs aborts); larmorx wrote an empty file. Now refused with ITK's message (`larmorx-io`, `itk/write.rs`)"

[[difference]]
tool = "ants-image-math"
implementation = "port"
signature = ["header (every field)"]
status = "fixed"
explanation = "ImageFileWriter writes the physical point of the first voxel (origin + Σ M·0), which turns an origin component of −0.0 into +0.0; larmorx wrote the origin as stored, so a RAS x of exactly 0 got the other sign (`larmorx-io`, `itk/write.rs`)"
link = "validation/investigations/difftest/signed_zero_origin.py"

[[difference]]
tool = "ants-atropos"
implementation = "port"
signature = ["DN fix pass", "stderr"]
status = "fixed"
explanation = "an empty mask: ITK's k-means throws while finding the empty sample's bounds; larmorx went on to the Gaussians' warnings and the labels' exception"

[[difference]]
tool = "ants-atropos"
implementation = "port"
signature = ["both succeed"]
status = "fixed"
explanation = "HistogramParzenWindows on an intensity image constant in the mask: its histogram's spacing is 0, which ITK's SetSpacing refuses (ANTs exits 1); larmorx went on"

