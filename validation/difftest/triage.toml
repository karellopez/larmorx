# (seed bet-options-6, 0.5 h, 24 jobs, 2,699 cases: bet -S, -B, -A, -A2, fslroi, standard_space_roi among
# bet2, bet and betsurf; FSL through the oracle cache in use mode; oracles/difftest/2026-11-04-bet-options-6b;
# a first start, 2026-11-04-bet-options-6, stopped after 127 cases: the original's runs of the replica-only
# programs, fixed in the harness). The replica: 2,580 agree; 70 notices and 47 differences triaged below;
# one timeout (case 1271, bet -S on a 300 s limit: the heavy queue).
