# SPDX-License-Identifier: Apache-2.0
# What was done about each difference random testing found (docs/validation/difftest.md,
# "Triage"). The site's "Random testing" panels read it (larmorx_validation.evidence.difftest):
# a random-testing run's difference takes the first entry of its tool and implementation that shares one of
# its checks (`signature`, the names of the checks that failed).
#
# status: fixed (larmorx was wrong; fixed, with a unit test and a permanent case), register (a
# defect of the original, in docs/findings/upstream-defects.md, decided by rules A-D), open (a
# clean-room original's difference, reported for its agent with a black-box reproducer),
# harness (the comparison's own mistake, corrected in the harness), explained (an expected
# difference, measured and explained: no mistake and no defect), unclear (for the orchestrator). link: a repository path (a permanent case, a finding) or a site path.

# ---------------------------------------------------------------- the trial runs (2026-10-25)

