# cases: a double -exp, -log, -sin or -cos whose value a later operation or a float output removes)
[[difference]]
tool = "fsl-maths"
implementation = "replica"
signature = ["every file bit-identical"]
status = "fixed"
explanation = "-dilall of a 7 x 13 x 3 float image holding NaN, inf and -inf, written as double: 42 of 273 voxels a NaN of the other sign. FSL's build adds each neighbour with the neighbour's converted value as the destination register (dilateval's sum += im(x, y, z)), so of a NaN neighbour and the default NaN an earlier inf + -inf left in the sum it passes on the neighbour's; the replica added the sum first. Fixed: filters::dilall takes the neighbour first (sse::add_f64), unit test dilall_passes_on_the_neighbours_nan_first; main's build gives the same difference (not from this part's change)"
link = "validation/difftest/cases/fsl-maths/dilall-nan-order.json"

