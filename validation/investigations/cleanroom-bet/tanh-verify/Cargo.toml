[package]
name = "tanh-glibc-verify"
description = "larmorx_core::math::tanh_glibc against the system's tanh (a black box) on a large random and edge sample"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: a verification tool, never part of larmorx's build (it calls the C
# library's tanh as a black box).
[workspace]

[dependencies]
larmorx-core = { path = "../../../../crates/larmorx-core" }

[profile.release]
debug = false
