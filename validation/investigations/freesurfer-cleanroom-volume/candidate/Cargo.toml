[package]
name = "fs-volume-candidate"
description = "larmorx's clean room of FreeSurfer's volume functions (larmorx-fs-core's volume) behind the commands of the black-box probe fs_volume_probe, for comparing them (specs/freesurfer-volume.md §69)"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: a validation tool, never part of larmorx's build.
[workspace]

[dependencies]
larmorx-core = { path = "../../../../crates/larmorx-core" }
larmorx-fs-core = { path = "../../../../crates/larmorx-fs-core" }

[profile.release]
debug = false
