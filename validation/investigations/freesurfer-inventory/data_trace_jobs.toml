# where both run), the bare steps recon-all runs without fs_time, the conditional branches, and
# fMRIPrep's and sMRIPrep's calls outside recon-all. {SD} is the rebuilt subject directory,
# {SUBJECTS_DIR} its parent, {FS} FREESURFER_HOME, {TMP} a scratch folder for outputs.
