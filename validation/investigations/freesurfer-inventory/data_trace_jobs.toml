# ---- bare steps of the v8 stream (recon-all runs them without fs_time; commands from recon-all.log)
[[job]]
name = "v8-bare-csvprint"
run = "ds000005-sub-01-v8"
step = 7
argv = ["csvprint", "--csv", "{SD}/stats/synthseg.vol.csv", "--f", "total intracranial"]
cwd = "{SD}/mri"

[[job]]
name = "v8-bare-mri_mcadura_seg"
run = "ds000005-sub-01-v8"
step = 17
argv = ["mri_mcadura_seg", "--i", "{SD}/mri/nu.mgz", "--o", "{SD}/mri/mca-dura.mgz", "--threads", "4", "--synthmorphdir", "{SD}/mri/transforms/synthmorph.1.0mm.1.0mm"]
cwd = "{SD}/mri"
timeout = 240

[[job]]
name = "v8-bare-mri_vsinus_seg"
run = "ds000005-sub-01-v8"
step = 17
argv = ["mri_vsinus_seg", "--s", "sub-01", "--rca-synthseg", "--threads", "4", "--synthmorphdir", "{SD}/mri/transforms/synthmorph.1.0mm.1.0mm", "--force"]
cwd = "{SD}/mri"
timeout = 240
note = "--force added: without it the script found its outputs up to date in the rebuilt directory and stopped"

[[job]]
name = "v8-bare-mri_mask-synthstrip"
run = "ds000005-sub-01-v8"
step = 12
argv = ["mri_mask", "{SD}/mri/T1.mgz", "{SD}/mri/synthstrip.mgz", "{SD}/mri/brainmask.mgz"]
cwd = "{SD}/mri"

[[job]]
name = "v8-bare-mri_entowm_seg"
run = "ds000005-sub-01-v8"
step = 14
argv = ["mri_entowm_seg", "--s", "sub-01", "--conform", "--threads", "4"]
cwd = "{SD}/mri"
timeout = 240

# ---- SynthSeg on a cropped patch: the same files as recon-all's call, but it finishes inside the
# 12 GiB box (the full call peaks at 21 GiB), so the files read after the prediction are seen too
[[job]]
name = "v8-variant-mri_synthseg-crop"
run = "ds000005-sub-01-v8"
step = 6
argv = ["mri_synthseg", "--i", "{SD}/mri/orig.mgz", "--o", "{TMP}/synthseg.mgz", "--threads", "4", "--vol", "{TMP}/synthseg.vol.csv", "--keepgeom", "--addctab", "--cpu", "--crop", "96"]
cwd = "{SD}/mri"
timeout = 300
note = "--crop 96 added (not recon-all's call) so that the run ends inside the memory box"

# ---- recon-all itself: its set-up (configuration, version listing) before one cheap stage
[[job]]
name = "v8-recon-all-setup"
run = "ds000005-sub-01-v8"
step = 196
argv = ["recon-all", "-s", "sub-01", "-avgcurv", "-openmp", "4"]
cwd = "{SUBJECTS_DIR}"
timeout = 400

[[job]]
name = "cl-recon-all-setup"
run = "ds000005-sub-01-v8"
step = 196
argv = ["recon-all", "-s", "sub-01", "-no-v8", "-avgcurv", "-openmp", "4"]
cwd = "{SUBJECTS_DIR}"
timeout = 400

# ---- the classic stream's bare and conditional Talairach steps
[[job]]
name = "cl-bare-lta_convert-mni305"
run = "ds000005-sub-01-classic"
step = 7
argv = ["lta_convert", "--src", "orig.mgz", "--trg", "{FS}/average/mni305.cor.mgz", "--inxfm", "transforms/talairach.xfm", "--outlta", "{TMP}/talairach.xfm.lta", "--subject", "fsaverage", "--ltavox2vox"]
cwd = "{SD}/mri"

[[job]]
name = "cl-cond-talairach_avi-3T18yo"
run = "ds000005-sub-01-classic"
step = 7
argv = ["talairach_avi", "--i", "orig_nu.mgz", "--xfm", "{TMP}/talairach.auto.xfm", "--atlas", "3T18yoSchwartzReactN32_as_orig"]
cwd = "{SD}/mri"
note = "recon-all's first retry when talairach_afd or Avi's QA check fails"

[[job]]
name = "cl-cond-talairach-mritotal"
run = "ds000005-sub-01-classic"
step = 7
argv = ["talairach", "--i", "orig_nu.mgz", "--xfm", "{TMP}/talairach.auto.xfm"]
cwd = "{SD}/mri"
timeout = 300
note = "recon-all's second retry (MINC's mritotal)"

# ---- fMRIPrep 25.2.6 / sMRIPrep 0.19.2 outside recon-all (programs.md section 5), on the finished subject
[[job]]
name = "fp-mri_robust_template"
run = "ds000005-sub-01-v8"
step = 196
argv = ["mri_robust_template", "--mov", "{SD}/mri/orig/001.mgz", "{SD}/mri/rawavg.mgz", "--average", "1", "--template", "{TMP}/template.mgz", "--satit", "--inittp", "1", "--fixtp", "--noit", "--iscale", "--iscaleout", "{TMP}/s1.txt", "{TMP}/s2.txt", "--subsample", "200", "--lta", "{TMP}/a.lta", "{TMP}/b.lta"]
cwd = "{TMP}"

[[job]]
name = "fp-lta_convert"
run = "ds000005-sub-01-v8"
step = 196
argv = ["lta_convert", "--inlta", "identity.nofile", "--src", "{SD}/mri/rawavg.mgz", "--trg", "{SD}/mri/orig.mgz", "--outlta", "{TMP}/identity.lta"]
cwd = "{TMP}"

[[job]]
name = "fp-mris_expand"
run = "ds000005-sub-01-v8"
step = 196
argv = ["mris_expand", "-thickness", "{SD}/surf/lh.white", "0.5", "{TMP}/lh.midthickness"]
cwd = "{TMP}"
env = { OMP_NUM_THREADS = "4" }

[[job]]
name = "fp-mri_robust_register"
run = "ds000005-sub-01-v8"
step = 196
argv = ["mri_robust_register", "--satit", "--iscale", "--mov", "{SD}/mri/T1.mgz", "--dst", "{SD}/mri/rawavg.mgz", "--lta", "{TMP}/robust.lta"]
cwd = "{TMP}"

[[job]]
name = "fp-mri_coreg"
run = "ds000005-sub-01-v8"
step = 196
argv = ["mri_coreg", "--s", "sub-01", "--mov", "{SD}/mri/rawavg.mgz", "--lta", "{TMP}/coreg.lta", "--dof", "6", "--sep", "4", "--ftol", "1.000000e-04", "--linmintol", "1.000000e-02"]
cwd = "{TMP}"

[[job]]
name = "fp-bbregister"
run = "ds000005-sub-01-v8"
step = 196
argv = ["bbregister", "--s", "sub-01", "--mov", "{SD}/mri/rawavg.mgz", "--t1", "--init-coreg", "--6", "--reg", "{TMP}/bbr.dat", "--lta", "{TMP}/bbr.lta"]
cwd = "{TMP}"
timeout = 400
note = "--t1 for a T1w moving image (fMRIPrep passes --t2 for BOLD and T2w); the programs and data are the same"

[[job]]
name = "fp-mri_vol2vol"
run = "ds000005-sub-01-v8"
step = 196
argv = ["mri_vol2vol", "--mov", "{SD}/mri/aseg.mgz", "--targ", "{SD}/mri/rawavg.mgz", "--lta", "{SD}/mri/rawavg2orig.lta", "--inv", "--interp", "nearest", "--o", "{TMP}/seg.nii.gz"]
