[package]
name = "fs-gifti"
description = "larmorx-io's GIFTI port (gifticlib 1.12's reading, checks, display and writer over larmorx_io::xml, the pure-Rust parser in expat 2.0.1's place) and larmorx-core's cscan::sscanf_f32, against the originals (gifticlib 1.12, expat 2.0.1 and nifticlib 2.0.0 built from their pinned sources, and FreeSurfer 8.2.0's copies as the unit oracle built them: GCC 8.4.0, FreeSurfer's flags)"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: a measurement tool, never part of larmorx's build (it calls libraries compiled
# from the originals through the dynamic loader).
[workspace]

[dependencies]
larmorx-core = { path = "../../../crates/larmorx-core" }
larmorx-io = { path = "../../../crates/larmorx-io" }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }

[profile.release]
debug = false
