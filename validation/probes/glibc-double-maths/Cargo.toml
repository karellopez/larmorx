[package]
name = "glibc-double-maths"
description = "How often glibc 2.35's double sin, cos, tan, asin, acos, atan, exp, log and pow differ from the correctly rounded result on fslmaths' arguments; larmorx_core::math::tan and atan against CORE-MATH's C"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: a measurement tool, never part of larmorx's build (it calls the C
# library's functions as black boxes).
[workspace]

[dependencies]
larmorx-core = { path = "../../../crates/larmorx-core" }

[profile.release]
debug = false
