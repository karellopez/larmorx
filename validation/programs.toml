# One entry per program and per module LARMORX ports, grouped by the software it comes from: the
# documentation site's Programs page (data/programs.yml) is generated from it, with the code and
# the records (docs/writing-guide.md §6):
#
#     python -m larmorx_validation reference programs --site <site>          write data/programs.yml
#     python -m larmorx_validation reference programs --site <site> --check  fail when it differs
#
# What the code and the records already say is not written here: the ports of a command come from
# the replica registry (crates/larmorx-cli/src/replica.rs), every port's status from its records
# (validation/tools.toml's `status`), the reference page from the site's checkout. A check fails
# when a command of `larmorx` (crates/larmorx-cli/src/lib.rs, FAMILIES) has no entry, when an
# entry names a record, an API page, an evidence page or a Python name that does not exist, or
# when its `records` name other ports than the registry lists.
#
# Fields of a group: `id` (the site's address, /programs/<id>/; a software colour of
# data/ecosystems.yml of the same name), `name`, `original` (what its ports are compared with),
# `summary` (what it holds, for the home page), `planned` (a text, for software with no port yet).
# Fields of a program: `group`, `name` (the command's own spelling; a module's name), `command`
# (absent for a module), `also` (another command that runs the same port), `python`, `does` (one
# sentence, in the words of its API page; absent where the API page holds the program's reference
# block, whose first sentence of what it does is taken instead), `api`, `evidence` (its evidence page on the site),
# `records` (per port: the records whose status it has; a module with no record takes the status
# its API page states), `ports` (for a program the replica registry does not list), `original`
# (where it is not the group's), `next_release` (ports that 0.1.0rc1 does not have: CHANGELOG.md's
# "Unreleased" and the roadmap's dates).

[[group]]
id = "ants"
name = "ANTs and ITK"
original = "ANTs 2.6.5 on ITK 5.4.5"
summary = "Transforms and their files, N4, denoising, `ImageMath` and its filters, registration (linear and deformable stages), `antsAI`, `Atropos`."

[[group]]
id = "afni"
name = "AFNI"
original = "AFNI 26.3.05"
summary = "`3dTshift`, `3dAutomask`, `3dUnifize` and `3dvolreg`. AFNI 26.3.05 released the Medical College of Wisconsin's code under CC BY 4.0, so the replicas are in `larmorx` beside the clean rooms."

[[group]]
id = "fsl"
name = "FSL"
original = "FSL 6.0.7.23"
summary = "`mcflirt`, BET, FLIRT and its programs, FAST, `topup`, `fslmaths`, `fslstats`, `fslroi`, `standard_space_roi` and `prelude`."

[[group]]
id = "tedana"
name = "tedana"
original = "tedana 26.0.3"
summary = "`t2smap`: the T2* and S0 maps of multi-echo fMRI and the echoes' optimal combination."

[[group]]
id = "sdcflows"
name = "sdcflows"
original = "sdcflows 2.17.1, with niworkflows 1.15.4 and pybids 0.22.0"
summary = "Field-map estimation: the B-spline fit, PEPOLAR, direct and fieldmap-less (SyN), sdcflows' BIDS app, with niworkflows' helpers and pybids' BIDS index."

[[group]]
id = "fmriprep"
name = "fMRIPrep"
original = "fMRIPrep's own steps, and the libraries they call"
summary = "fMRIPrep's one-shot BOLD resampler, its field-map steps and its confound estimation, and SciPy's and scikit-image's routines under them."

[[group]]
id = "larmorx"
name = "LARMORX's own"
original = ""
summary = "Its NIfTI reader and writer. The larmorprepx pipeline is planned."

[[group]]
id = "freesurfer"
name = "FreeSurfer"
original = "FreeSurfer 8.2.0"
planned = "Every program complete, a replica in its own package, `larmorx-freesurfer`, and a clean room built for speed."

[[group]]
id = "workbench"
name = "Workbench"
original = "Connectome Workbench and MSM"
planned = "Surface tools compatible with Connectome Workbench and MSM."

