# One description per tool and per validation record: the facts that the README's tool table,
# the validation index (docs/validation/README.md) and the documentation site's status table
# (data/status.yml) show and that the records cannot provide. The numbers come from the
# records' JSON (docs/validation/<record>.json), computed by larmorx_validation.tables:
#
#     python -m larmorx_validation tables            # write the three tables
#     python -m larmorx_validation tables --check    # fail when a committed table differs
#
# In the texts, {<record>.<metric>} is a number from a record (larmorx_validation.tables.METRICS
# says how each is computed); [text](record:<record>) links a record and [text](repo:<path>) a
# file of this repository, each written as the table's place needs (README.md, the validation
# index, the site's repo: links). Edit a text here, never in the generated tables.

# ------------------------------------------------------------------------------------------------
# Tools: the README's "Supported tools" table and the site's status table, in this order.

